  --bg:#0d0e10;--panel:#15171b;--raise:#1c1f25;--raise2:#242830;--line:#2a2e36;
  --text:#f1ede4;--mute:#8d919b;--faint:#5b606b;
  --amber:#f0a81a;--amber-d:#8a6212;--amber-bg:rgba(240,168,26,.12);
  --pos:#34d399;--pos-bg:rgba(52,211,153,.12);--neg:#ff5b6e;--neg-bg:rgba(255,91,110,.12);
  --info:#6aa9ff;--warn:#ffb84d;
  --f-ui:"Segoe UI Variable Text","SF Pro Text","Inter","Roboto",system-ui,-apple-system,sans-serif;
  --f-num:"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;--r-s:8px;--pad:12px;--gap:10px;--nav-h:58px;--top-h:52px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
body[data-density=compact]{--pad:8px;--gap:6px;--r:9px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--f-ui);overscroll-behavior:none}
body{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.pos{color:var(--pos)}.neg{color:var(--neg)}.amber{color:var(--amber)}.info{color:var(--info)}.warn{color:var(--warn)}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-rows:calc(var(--top-h) + var(--safe-t)) 1fr;grid-template-columns:1fr}
#top{display:flex;align-items:center;gap:8px;padding:var(--safe-t) 10px 0;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px;display:flex;flex-direction:column;line-height:1.05;flex:none}
.brand b{color:var(--amber);font-size:15px;letter-spacing:.16em}
.brand small{font-size:7.5px;letter-spacing:.2em;color:var(--mute);font-weight:600;white-space:nowrap}
.top-mid{flex:1;min-width:0;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:var(--raise);border:1px solid var(--line);font-size:11.5px;white-space:nowrap;min-height:30px}
button.chip{background:var(--raise)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--pos);box-shadow:0 0 8px var(--pos)}.dot.wait{background:var(--warn);animation:pulse 1s infinite}.dot.err{background:var(--neg)}
@keyframes pulse{50%{opacity:.35}}
.mode-demo{color:var(--info);border-color:rgba(106,169,255,.4)}
.mode-real{color:#fff;background:var(--neg);border-color:var(--neg);font-weight:700}
#kill{background:var(--neg-bg);border:1px solid var(--neg);color:var(--neg);font-weight:800;border-radius:8px;min-height:34px;padding:0 10px;font-size:12px;flex:none}
#kill.on{background:var(--neg);color:#fff}
#main{overflow-y:auto;overflow-x:hidden;padding:var(--gap);padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);z-index:6}
#nav button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;position:relative}
#nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current=page]{color:var(--amber)}
#nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--amber);border-radius:0 0 3px 3px}
#nav .badge{position:absolute;top:6px;right:26%;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#000;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.view{display:none;flex-direction:column;gap:var(--gap);max-width:760px;margin:0 auto}
body[data-tab=market] #v-market,body[data-tab=analysis] #v-analysis,body[data-tab=trade] #v-trade,body[data-tab=history] #v-history,body[data-tab=settings] #v-settings{display:flex}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0}
.card>h3,.card>.hd{margin:0 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>.hd h3{margin:0;font-size:11.5px;letter-spacing:.06em;color:var(--mute)}
.card.collapsible>.hd{cursor:pointer;user-select:none}
.card.collapsible.closed>.body{display:none}
.card .caret{transition:transform .15s;color:var(--mute)}
.card.closed .caret{transform:rotate(-90deg)}
.row{display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.kv{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv small{font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.kv b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{height:1px;background:var(--line);margin:8px 0;border:0}
.note{font-size:11.5px;color:var(--mute);line-height:1.45}
.warnbox{background:var(--amber-bg);border:1px solid var(--amber-d);color:var(--warn);border-radius:var(--r-s);padding:8px 10px;font-size:12px}
.errbox{background:var(--neg-bg);border:1px solid var(--neg);color:var(--neg);border-radius:var(--r-s);padding:8px 10px;font-size:12px}

/* ---------- controls ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute);font-weight:600;min-width:0}
input[type=text],input[type=password],input[type=number],input[type=search],select{background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:0 10px;min-height:42px;width:100%;color:var(--text);font-size:15px;min-width:0}
input[type=number]{font-family:var(--f-num)}
input[type=range]{width:100%;accent-color:var(--amber);min-height:34px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--amber);flex:none}
.chk{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13px;color:var(--text);font-weight:500}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--raise2);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--amber);color:#111;border-color:var(--amber)}
.btn.pos{background:var(--pos);color:#04140c;border-color:var(--pos)}
.btn.neg{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:6px;min-height:36px;font-weight:700;font-size:12.5px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--amber);color:#111}
.seg.real button[aria-pressed=true]{background:var(--neg);color:#fff}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.06em;border:1px solid var(--line);background:var(--raise);color:var(--mute)}
.pill.WATCH{color:var(--mute)}.pill.QUALIFIED{color:var(--info);border-color:var(--info);background:rgba(106,169,255,.1)}
.pill.READY{color:#04140c;background:var(--pos);border-color:var(--pos)}.pill.EXECUTED{color:#111;background:var(--amber);border-color:var(--amber)}
.pill.BLOCKED{color:var(--neg);border-color:var(--neg);background:var(--neg-bg)}.pill.COOLDOWN{color:var(--warn);border-color:var(--warn)}
.pill.pos{color:var(--pos);border-color:var(--pos);background:var(--pos-bg)}.pill.neg{color:var(--neg);border-color:var(--neg);background:var(--neg-bg)}
.pill.amber{color:var(--amber);border-color:var(--amber-d);background:var(--amber-bg)}
.tag-paper{color:var(--info);border:1px dashed var(--info);border-radius:4px;padding:0 5px;font-size:10px;font-weight:800}
.tag-real{color:#fff;background:var(--neg);border-radius:4px;padding:0 5px;font-size:10px;font-weight:800}
.tag-demo{color:var(--amber);border:1px solid var(--amber-d);border-radius:4px;padding:0 5px;font-size:10px;font-weight:800}

/* ---------- market card / radar ---------- */
.mkt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.mkt .name{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.quote{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.quote i{font-style:normal;color:var(--amber)}
.bigdigit{width:76px;height:76px;border-radius:18px;background:var(--amber-bg);border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:var(--amber);font-family:var(--f-num)}
.bigdigit.flash{animation:flash .35s}
@keyframes flash{0%{background:var(--amber);color:#111}}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats4 .kv b{font-size:13px}
canvas{display:block;width:100%}
#cv-tick{height:150px}#cv-stream{height:96px}
.radar-wrap{display:flex;justify-content:center;position:relative}
#radar{width:min(100%,330px);height:auto;touch-action:manipulation}
#radar .node{cursor:pointer}
#radar text{font-family:var(--f-num);font-weight:700;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--mute);justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 5px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
tbody tr+tr td{border-top:1px solid rgba(255,255,255,.04)}
td.hot{background:rgba(240,168,26,.22);color:#ffd27a}td.hot2{background:rgba(240,168,26,.1)}
td.cold{background:rgba(106,169,255,.2);color:#b5d3ff}td.cold2{background:rgba(106,169,255,.08)}
tr.cur td:first-child{color:var(--amber);font-weight:800}
tr.clickable{cursor:pointer}
.hist{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:110px}
.hist .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;cursor:pointer}
.hist .bar{width:100%;background:var(--faint);border-radius:3px 3px 0 0;min-height:2px;transition:height .15s}
.hist .col.hot .bar{background:var(--amber)}.hist .col.cold .bar{background:var(--info)}.hist .col.cur .bar{outline:1px solid #fff}
.hist .col span{font-size:10.5px;color:var(--mute)}.hist .col b{font-size:11px;font-family:var(--f-num)}
.meter{height:8px;background:var(--raise2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .2s}
.comp{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-size:11.5px;padding:2px 0}
.comp .meter{height:6px}
.comp b{text-align:right;font-family:var(--f-num)}

/* ---------- signals ---------- */
.sig{border-left:3px solid var(--line)}
.sig.READY{border-left-color:var(--pos)}.sig.QUALIFIED{border-left-color:var(--info)}.sig.BLOCKED{border-left-color:var(--neg)}.sig.EXECUTED{border-left-color:var(--amber)}
.score{font-size:38px;font-weight:800;font-family:var(--f-num);line-height:1}
.score small{font-size:13px;color:var(--mute);font-weight:600}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}
.stages div{font-size:9.5px;text-align:center;padding:5px 2px;border-radius:5px;background:var(--raise);color:var(--faint);font-weight:700;letter-spacing:.03em}
.stages div.on{background:var(--amber-bg);color:var(--amber)}.stages div.bad{background:var(--neg-bg);color:var(--neg)}.stages div.good{background:var(--pos-bg);color:var(--pos)}
.reasons{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.reasons span{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--neg-bg);color:var(--neg);letter-spacing:.03em}
.reasons span.w{background:var(--amber-bg);color:var(--warn)}

/* ---------- trade panel ---------- */
.buy{width:100%;min-height:64px;border-radius:14px;border:0;background:var(--pos);color:#04140c;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.buy small{font-size:12.5px;font-weight:600;opacity:.85}
.buy[disabled]{background:var(--raise2);color:var(--faint);pointer-events:none}
.buy.real{background:var(--neg);color:#fff}
.digitpick{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.digitpick button{min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-family:var(--f-num);font-weight:800;font-size:16px}
.digitpick button[aria-pressed=true]{background:var(--amber);color:#111;border-color:var(--amber)}
.digitpick button.sug{border-color:var(--pos)}
.bigswitch{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.bigswitch .st{font-size:22px;font-weight:800;letter-spacing:.06em}
.bigswitch .st.on{color:var(--pos)}.bigswitch .st.off{color:var(--faint)}
.risk-zone{border:1px solid var(--neg);background:linear-gradient(180deg,rgba(255,91,110,.05),transparent)}
.contract{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.contract:first-of-type{border-top:0}
.contract .pl{font-size:16px;font-weight:800;font-family:var(--f-num);text-align:right}
.log{max-height:260px;overflow:auto;font:11px/1.5 var(--f-num);background:#08090b;border:1px solid var(--line);border-radius:var(--r-s);padding:8px;white-space:pre-wrap;word-break:break-all}
.log .e{color:var(--neg)}.log .t{color:var(--info)}.log .b{color:var(--amber)}.log .w{color:var(--warn)}

/* ---------- subtabs / sheets / toasts ---------- */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:0 14px;min-height:34px;font-size:12.5px;font-weight:700;color:var(--mute)}
.subtabs button[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#111}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;padding:14px var(--pad) calc(16px + var(--safe-b));animation:up .2s}
@keyframes up{from{transform:translateY(30px)}}
.sheet h2{margin:0 0 10px;font-size:16px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.mrow:active,.mrow:hover{background:var(--raise)}
.mrow .s{font-size:11px;color:var(--mute)}
.mrow.sel{background:var(--amber-bg)}
.mrow button.star{background:none;border:0;font-size:18px;color:var(--faint);min-width:36px;min-height:36px}
.mrow button.star.on{color:var(--amber)}
#toasts{position:fixed;left:8px;right:8px;top:calc(var(--top-h) + var(--safe-t) + 6px);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;align-items:center}
.toast{pointer-events:auto;background:var(--raise2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:9px 12px;max-width:440px;width:100%;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:up .2s}
.toast.pos{border-left-color:var(--pos)}.toast.neg{border-left-color:var(--neg)}.toast.info{border-left-color:var(--info)}
.toast b{display:block;font-size:12px;letter-spacing:.04em}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--amber-bg);color:var(--amber);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}

/* ---------- Public market feed ---------- */
const catOf = s => { const n = (s.name || '') + ' ' + (s.symbol || ''); if (/crash|boom/i.test(n)) return 'Crash/Boom'; if (/volatility|^R_|^1HZ/i.test(n)) return 'Volatility'; if (s.market === 'synthetic_index') return 'Other synthetic'; if (/forex/i.test(s.market)) return 'Forex'; if (/crypto/i.test(s.market)) return 'Crypto'; if (/commod/i.test(s.market)) return 'Commodities'; return 'Other'; };

  ws: null, tickRec: null, watchRec: null, tok: 0, buffering: null, seeding: false,

  start() { Feed.ws.open(); },

  },
  async loadSymbols() {
    const cached = LS.get('de.symbols.v1', null);

    try {
      let m; try { m = await Feed.ws.send({ active_symbols: 'brief', contract_type: ['DIGITDIFF', 'DIGITOVER'] }); } catch (e) { m = await Feed.ws.send({ active_symbols: 'brief' }); }
      const arr = (m.active_symbols || []).map(a => ({ symbol: a.underlying_symbol || a.symbol, name: a.underlying_symbol_name || a.display_name || a.underlying_symbol || a.symbol, market: a.market, submarket: a.submarket, pip: Number(a.pip_size), open: a.exchange_is_open !== 0, suspended: a.is_trading_suspended === 1 })).filter(x => x.symbol);

    } catch (e) { Dev.log('err', 'symbols', 0, e.message); Alert.fire('error', 'MARKET LIST', humanError(e).text, 'neg'); }
  },
  setSymbols(list) { S.symbols = list.map(x => ({ ...x, cat: catOf(x) })).sort((a, b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name)); S.symMap = new Map(S.symbols.map(x => [x.symbol, x])); Bus.emit('SYMBOLS_UPDATED'); },
  async select(sym, force) {
    if (!sym) return; const M = S.market;

    const tok = ++Feed.tok; const info = S.symMap.get(sym);
    if (Feed.tickRec) { Feed.ws.forget(Feed.tickRec); Feed.tickRec = null; }
    if (sym !== M.symbol || force) { S.feedEpoch++; S.paperOpen = []; }
    M.symbol = sym; M.name = info ? info.name : sym; M.quote = null; M.prev = null; M.digit = -1; M.epoch = 0; M.tickTs = 0; M.tsBuf = []; M.state = 'NO DATA'; M.integrity = 'GOOD'; M.digitOK = null;
    M.dec = info && Digit.decFromPipSize(info.pip) != null ? Digit.decFromPipSize(info.pip) : S.cfg.market.precision; M.decSrc = info ? 'symbol' : 'default';
    S.buf.clear(); S.an = null; S.sig = { DIFFERS: null, OVER2: null }; S.props.clear(); S.track = { DIFFERS: { target: null, n: 0 }, OVER2: { n: 0 } };
    cfgSet('market.symbol', sym); S.cfg.market.symbol = sym; saveCfg(); Bus.emit('MARKET_CHANGED');
    Feed.contracts(sym, tok);
    if (!Feed.ws.ready) return;
    Feed.seeding = true; Feed.buffering = [];
    const sub = Feed.ws.sub({ ticks: sym, subscribe: 1 }, m => Feed.onTickMsg(m, tok)); Feed.tickRec = sub.rec; sub.promise.catch(e => { Alert.fire('error', 'TICK STREAM', humanError(e).text, 'neg'); });
    try {
      const h = await Feed.ws.send({ ticks_history: sym, adjust_start_time: 1, count: S.cfg.market.history, end: 'latest', style: 'ticks' }, { timeout: 15000 });
      if (tok !== Feed.tok) return;

      if (Array.isArray(prices) && Array.isArray(times)) {

        const hd = Digit.decFromTickPip(h.pip_size); if (hd != null && S.cfg.market.precisionMode === 'auto') { M.dec = hd; M.decSrc = 'feed'; }
        const dec = Feed.dec(null); S.buf.clear();
        for (let i = 0; i < prices.length; i++) { const q = Number(prices[i]), e = Number(times[i]); S.buf.push(q, e, Digit.of(q, dec)); }
        const n = S.buf.len; if (n) { M.quote = S.buf.qEnd(0); M.epoch = S.buf.eEnd(0); M.digit = S.buf.dEnd(0); if (n > 1) M.prev = S.buf.qEnd(1); }
      }
    } catch (e) { Dev.log('err', 'history', 0, e.message); Alert.fire('error', 'HISTORY', humanError(e).text, 'neg'); }
    if (tok !== Feed.tok) return;
    Feed.seeding = false; const q = Feed.buffering || []; Feed.buffering = null; for (const t of q) Feed.onTick(t); Feed.after(true);
  },
  async contracts(sym, tok) {
    try {
      const m = await Feed.ws.send({ contracts_for: sym }); if (tok !== Feed.tok) return; const av = (m.contracts_for && m.contracts_for.available) || [];
      const df = av.find(x => x.contract_type === 'DIGITDIFF'), ov = av.find(x => x.contract_type === 'DIGITOVER'); const M = S.market; M.digitOK = !!(df && ov);

  dec(t) { const M = S.market; if (S.cfg.market.precisionMode === 'manual') { M.decSrc = 'manual'; return S.cfg.market.precision; } const d = t ? Digit.decFromTickPip(t.pip_size) : null; if (d != null) { M.dec = d; M.decSrc = 'feed'; } return M.dec; },
  onTickMsg(m, tok) { if (tok !== Feed.tok || !m || m.error || !m.tick) return; if (Feed.buffering) { Feed.buffering.push(m.tick); return; } Feed.onTick(m.tick); Feed.after(false); },
  onTick(t) {
    const M = S.market; if (!t || t.symbol !== M.symbol) return; const q = Number(t.quote), e = Number(t.epoch);
    if (!Number.isFinite(q) || !Number.isFinite(e)) { Dev.log('err', 'tick', 0, 'malformed tick rejected'); return; }

/* ---------- Analysis (recomputed on every tick, bounded work) ---------- */
const Analysis = {
  econFor(strat) { const r = S.lastRatio[strat]; return r ? { breakeven: 1 / r } : null; },
  run() {
    const cfg = S.cfg, buf = S.buf; if (!buf.len) { S.an = null; return; }
    const snap = snapshotFromBuffer(buf, cfg.analysis.windows), cons = consensus(snap, cfg.analysis.hotZ);
    const dres = differs(snap, cons, cfg, Analysis.econFor('DIFFERS')), ores = over2(snap, cons, cfg, Analysis.econFor('OVER2'));
    const q = { DIFFERS: qualify(dres, cfg), OVER2: qualify(ores, cfg) };
    const T = S.track; if (T.DIFFERS.target === dres.best.d) T.DIFFERS.n++; else { T.DIFFERS.target = dres.best.d; T.DIFFERS.n = 1; } if (q.OVER2.qualified) T.OVER2.n++; else T.OVER2.n = 0;
    const big = cons.perWin.length ? cons.perWin[cons.perWin.length - 1] : null;
    const seq = sequence(buf.last(100)); S.seq = seq;
    const conf = {};
    for (const st of STRATS) {
      const res = st === 'DIFFERS' ? dres : ores, best = st === 'DIFFERS' ? dres.best : null; const agree = best ? best.agree : res.agree;
      conf[st] = confidence({ n: snap.n, nw: snap.windows.length, agree, meanZ: best ? best.meanZ : res.meanZ, entropy: big ? big.ent : 0, transRows: snap.cur >= 0 ? transRow(snap, snap.cur) : 0, momentum: best ? best.momentum : res.momentum, persist: st === 'DIFFERS' ? T.DIFFERS.n : T.OVER2.n });
    }
    let st = 'BALANCED'; if (big) { const mz = Math.max(...big.rows.map(r => r.z)), nz = Math.min(...big.rows.map(r => r.z)); if (big.n >= 50 && big.chi.p < 0.05) st = 'CONCENTRATED'; else if (mz >= 2) st = 'HOT DIGIT'; else if (nz <= -2) st = 'COLD DIGIT'; else if (big.ent >= 0.97) st = 'HIGH ENTROPY'; else if (big.ent < 0.9) st = 'LOW ENTROPY'; }
    S.market.statState = st;
    S.an = { snap, cons, dres, ores, q, conf, big, ts: now(), n: buf.len };
    Bus.emit('ANALYSIS_UPDATED');
    if (buf.total % 100 === 0 || (buf.len === S.cfg.analysis.minSample && !S.edge.DIFFERS)) Edge.schedule();
  }
};

/* ---------- Proposal engine (warm cache → single-round-trip buys) ---------- */
const Prop = {
  key(p) { return [p.symbol, p.strategy, p.strategy === 'DIFFERS' ? p.target : 2, Number(p.stake).toFixed(2), p.duration, p.currency].join('|'); },
  sock() { return S.tradeWs && S.tradeWs.ready ? S.tradeWs : (Feed.ws && Feed.ws.ready ? Feed.ws : null); },
  onTrade() { return !!(S.tradeWs && S.tradeWs.ready); },
  params(strat, target, stake) { const c = S.cfg; return { symbol: S.market.symbol, strategy: strat, target: strat === 'DIFFERS' ? target : 2, stake: stake != null ? stake : S.risk.nextStake(c, S.acct.balance), duration: c.trading.duration, currency: S.acct.currency || c.trading.currency }; },
  get(p) { return S.props.get(Prop.key(p)) || null; },
  fresh(p) { const r = Prop.get(p); return r && r.viaTrade && now() - r.ts < S.cfg.risk.proposalMaxAgeSec * 1000 * 0.9 ? r : null; },
  pending: new Map(),
  async request(p, force) {
    const k = Prop.key(p), ws = Prop.sock(); if (!ws) throw new Error('No connection for proposals');
    if (Prop.pending.has(k) && !force) return Prop.pending.get(k);
    const req = { proposal: 1, amount: Number(p.stake), basis: 'stake', contract_type: CT[p.strategy], currency: p.currency, duration: p.duration, duration_unit: 't', underlying_symbol: p.symbol, barrier: String(p.target) };
    const viaTrade = ws === S.tradeWs;
    const pr = ws.send(req, { timeout: 8000 }).then(m => {
      const x = m.proposal; if (!x || !x.id) throw new Error('Proposal response missing id');
      const ask = Number(x.ask_price), payout = Number(x.payout); if (!(ask > 0) || !(payout > 0)) throw new Error('Proposal has invalid price');
      const rec = { key: k, id: x.id, ask, payout, ratio: payout / ask, profit: payout - ask, ts: now(), spot: Number(x.spot), longcode: x.longcode, strategy: p.strategy, target: p.target, stake: p.stake, duration: p.duration, viaTrade };
      S.props.set(k, rec); S.lastRatio[p.strategy] = rec.ratio; Bus.emit('PROPOSAL_UPDATED', rec);
      if (S.props.size > 60) { const old = [...S.props.entries()].sort((a, b) => a[1].ts - b[1].ts).slice(0, 20); old.forEach(([kk]) => S.props.delete(kk)); }
      return rec;
    }).finally(() => Prop.pending.delete(k));
    Prop.pending.set(k, pr); return pr;
  },
  loopT: null,
  startLoop() { clearInterval(Prop.loopT); Prop.loopT = setInterval(() => Prop.warm(), 3000); setTimeout(() => Prop.warm(), 600); },
  desired() {
    const out = [], a = S.an; if (!a) return out; const c = S.cfg, stake = S.risk.nextStake(c, S.acct.balance);
    const ranked = a.dres.cands.slice().sort((x, y) => y.score - x.score); const tgs = new Set();
    if (c.trading.targetMode === 'manual') tgs.add(c.trading.target); else { tgs.add(ranked[0].d); tgs.add(ranked[1].d); }
    tgs.add(c.trading.target);
    for (const t of tgs) out.push(Prop.params('DIFFERS', t, stake)); out.push(Prop.params('OVER2', 2, stake));
    return out;
  },
  warm() {
    if (S.risk.kill || !Prop.sock() || document.hidden || !S.market.symbol || S.market.digitOK === false) return;
    const maxAge = S.cfg.risk.proposalMaxAgeSec * 1000 * 0.6;

  }

/* ---------- Signals: 5-stage pipeline → WATCH / QUALIFIED / READY / EXECUTED / BLOCKED / COOLDOWN ---------- */
const Signals = {
  active(st) { return S.autoArmed && S.cfg.trading.mode === 'auto' && S.cfg.trading.strategy === st; },
  targetFor(st, res) { return st === 'DIFFERS' ? (S.cfg.trading.targetMode === 'auto' ? res.best.d : S.cfg.trading.target) : 2; },
  update() {
    const a = S.an; if (!a) return; const cfg = S.cfg, t = now(), acct = acctKey();
    for (const st of STRATS) {
      const res = st === 'DIFFERS' ? a.dres : a.ores, q = a.q[st], target = Signals.targetFor(st, res);
      const stake = S.risk.nextStake(cfg, S.acct.balance), p = Prop.get(Prop.params(st, target, stake));
      const score = q.score, rv = S.risk.view(acct, cfg, t);
      const gate = canTrade({ strategy: st, score, q }, p, rv, { cfg, auto: Signals.active(st), now: t, connOK: Signals.connOK(), stake, edge: S.edge[st], holdUntil: S.holdUntil });
      let state = 'WATCH';
      if (q.qualified) {
        if (t - S.lastExec[st] < 3000) state = 'EXECUTED';
        else if (rv.cooldownLeft > 0 && Signals.active(st)) state = 'COOLDOWN';
        else if (gate.allowed) state = 'READY';
        else if (gate.reasons.every(r => r === 'PROPOSAL_UNAVAILABLE')) state = 'QUALIFIED';
        else state = 'BLOCKED';
      }
      const prev = S.sig[st]; const changed = !prev || prev.state !== state || prev.target !== target;

      if (changed) Signals.onChange(st, prev, S.sig[st], res);
      if (state === 'READY' && Signals.active(st) && !S.execLock) Exec.buy({ strategy: st, target, source: 'auto', score, stake });
    }

  },
  connOK() { const M = S.market; return Prop.onTrade() && Feed.ws.ready && (now() - M.tickTs) < S.cfg.risk.staleSec * 1000 && S.market.digitOK !== false && S.acct.id != null; },
  onChange(st, prev, cur, res) {
    const was = prev ? prev.state : 'WATCH';
    const rank = { WATCH: 0, COOLDOWN: 0, QUALIFIED: 1, READY: 2, EXECUTED: 2, BLOCKED: 1 };
    if (cur.state === 'QUALIFIED' || cur.state === 'READY' || cur.state === 'BLOCKED') Journal.log(st, cur, res);
    if ((cur.state === 'QUALIFIED' || cur.state === 'READY') && rank[was] < 1 && now() - S.lastSignalAlert[st] > 15000) { S.lastSignalAlert[st] = now(); Alert.fire('signal', (st === 'DIFFERS' ? 'DIFFERS ' + cur.target : 'OVER 2') + ' signal', 'Score ' + Math.round(cur.score) + ' · ' + cur.state, 'info'); }
    if (cur.state === 'READY' && was !== 'READY' && cur.proposal) Alert.fire('proposal', 'Proposal ready', st + ' · payout ' + money(cur.proposal.payout) + ' on ' + money(cur.proposal.ask), 'info');
    if (cur.state === 'BLOCKED' && was !== 'BLOCKED' && Signals.active(st)) { Bus.emit('RISK_BLOCKED', cur.gate.reasons); Alert.fire('blocked', 'Risk blocked', cur.gate.reasons.join(', '), 'neg'); }
  }
};

/* ---------- Journal: every qualified signal is logged ---------- */
const Journal = {
  log(st, sig, res) {
    const a = S.an; if (!a) return; const best = st === 'DIFFERS' ? res.best : null;
    const rec = { ts: now(), market: S.market.symbol, strategy: st, digitWindow: S.cfg.analysis.windows.join(','), sampleSize: a.n, targetDigit: sig.target, frequencies: best ? best.freqs.map(x => +(x * 100).toFixed(1)) : res.per.map(p => +(p.obs * 100).toFixed(1)), consensus: best ? best.agree + '/' + res.nw : res.agree + '/' + res.nw, entropy: a.big ? +a.big.ent.toFixed(3) : null, transitionScore: +(((best ? best.comp.trans : res.comp.trans)) * 100).toFixed(0), signalScore: +sig.score.toFixed(1), proposal: sig.proposal ? { ask: sig.proposal.ask, payout: sig.proposal.payout } : null, decision: sig.state, reasons: sig.gate.reasons };
    DB.add('signals', rec);
  }
};

/* ---------- Edge validation: walk-forward on the session's own buffer (out-of-sample split, Wilson CI vs break-even) ---------- */
const Edge = {
  busy: false, tm: null,
  schedule() { clearTimeout(Edge.tm); Edge.tm = setTimeout(() => Edge.run(), 80); },
  params(st, over) { const c = S.cfg; return { strategy: st, windows: c.analysis.windows, minAgree: c.analysis.minAgree, threshold: c.analysis.threshold, minSample: c.analysis.minSample, stake: c.bt.stake, ratio: S.lastRatio[st] || (st === 'DIFFERS' ? c.bt.ratioDiffers : c.bt.ratioOver2), dur: c.trading.duration, cooldown: c.bt.cooldown, mode: c.analysis.differsMode, weights: c.analysis.w, hotZ: c.analysis.hotZ, ...over }; },
  run() {
    if (Edge.busy || S.buf.len < 150) return; Edge.busy = true;
    try {
      const dg = S.buf.last(S.cfg.bt.history);
      for (const st of STRATS) { const p = Edge.params(st), bt = backtest(dg, p), seg = segmentize(bt, dg.length), v = edgeVerdict(seg, p.ratio, S.cfg.risk.minOOS); S.edge[st] = { ...v, seg, n_total: seg.all.n, ratio: p.ratio, sample: dg.length, ts: now() }; }
      Bus.emit('EDGE_UPDATED');
    } catch (e) { Dev.log('err', 'edge', 0, e.message); }
    Edge.busy = false;
  }
};

/* ---------- Paper / research trading on real incoming ticks ---------- */
const Paper = {
  tick() {
    const cfg = S.cfg; if (!S.an) return; const total = S.buf.total;
    for (let i = S.paperOpen.length - 1; i >= 0; i--) {
      const t = S.paperOpen[i]; if (t.feedEpoch !== S.feedEpoch) { S.paperOpen.splice(i, 1); continue; }
      if (total >= t.entryTotal + t.duration) {
        const out = S.buf.dEnd(total - (t.entryTotal + t.duration)); const win = t.strategy === 'DIFFERS' ? out !== t.target : out > 2;
        t.exitDigit = out; t.pl = win ? t.stake * (t.ratio - 1) : -t.stake; t.status = 'closed'; t.closeTs = now(); t.result = win ? 'WIN' : 'LOSS';
        S.paperOpen.splice(i, 1); S.trades.push(t); DB.put('trades', t); S.lastPaperClose[t.strategy] = total; Bus.emit('TRADE_CLOSED', t);
        if (S.trades.length > 6000) S.trades.splice(0, 500);
      }
    }
    if (!cfg.research) return;
    for (const st of STRATS) {
      const sg = S.sig[st]; if (!sg || !sg.q.qualified) continue; if (S.paperOpen.some(t => t.strategy === st)) continue; if (total - S.lastPaperClose[st] < cfg.bt.cooldown) continue;
      const ratio = S.lastRatio[st] || (st === 'DIFFERS' ? cfg.bt.ratioDiffers : cfg.bt.ratioOver2);
      S.paperOpen.push({ id: 'P' + uid(), ts: now(), mode: 'paper', source: 'paper', acct: 'paper', symbol: S.market.symbol, strategy: st, target: sg.target, stake: cfg.bt.stake, ratio, payout: cfg.bt.stake * ratio, score: sg.score, window: cfg.analysis.windows.join('/'), duration: cfg.trading.duration, status: 'open', entryTotal: total, feedEpoch: S.feedEpoch });
    }
  }
};

/* ---------- Execution (proposal → risk → buy → monitor) ---------- */
const Exec = {
  async buy(intent) {
    if (S.execLock) return { ok: false, reason: 'BUSY' };
    const cfg = S.cfg; S.execLock = true; const t0 = performance.now();
    try {
      if (!Prop.onTrade()) throw Object.assign(new Error('Trade connection is not open. Connect a Deriv account first.'), { code: 'NotConnected' });
      const stake = Number(Math.min(intent.stake != null ? intent.stake : S.risk.nextStake(cfg, S.acct.balance), cfg.risk.maxStake).toFixed(2));
      const p0 = Prop.params(intent.strategy, intent.target, stake);
      let p = Prop.fresh(p0); if (!p) p = await Prop.request(p0, true);
      const a = S.an, sg = S.sig[intent.strategy];
      const gate = canTrade({ strategy: intent.strategy, score: intent.score, q: sg ? sg.q : { reasons: [] } }, p, S.risk.view(acctKey(), cfg), { cfg, auto: intent.source === 'auto', now: now(), connOK: Signals.connOK(), stake, edge: S.edge[intent.strategy], holdUntil: S.holdUntil });
      if (!gate.allowed) { Bus.emit('RISK_BLOCKED', gate.reasons); Alert.fire('blocked', 'Trade blocked', gate.reasons.join(', '), 'neg'); return { ok: false, reason: gate.reasons.join(',') }; }
      Bus.emit('TRADE_SUBMITTED', { intent, p });
      const buyReq = pr => ({ buy: pr.id, price: Number(pr.ask.toFixed(2)) });
      let r; try { r = await S.tradeWs.send(buyReq(p), { timeout: 10000 }); } catch (e) {
        if (!intent.retried && /proposal|expired|invalid/i.test((e.code || '') + ' ' + e.message) && !/InsufficientBalance|Balance/i.test(e.code || '')) { intent.retried = true; p = await Prop.request(p0, true); r = await S.tradeWs.send(buyReq(p), { timeout: 10000 }); } else throw e;
      }
      const b = r.buy; if (!b || !b.contract_id) throw new Error('Buy response contained no contract id');
      const acct = acctKey(), best = a && intent.strategy === 'DIFFERS' ? a.dres.cands[intent.target] : null;
      const tr = { id: String(b.contract_id), contractId: b.contract_id, ts: now(), mode: acct, source: intent.source, acct, acctId: S.acct.id, symbol: S.market.symbol, strategy: intent.strategy, target: intent.target, stake: Number(b.buy_price), payout: Number(b.payout), ratio: Number(b.payout) / Number(b.buy_price), score: intent.score, window: cfg.analysis.windows.join('/'), duration: cfg.trading.duration, status: 'open', longcode: b.longcode, proposalId: p.id, buyRes: { transaction_id: b.transaction_id, start_time: b.start_time, purchase_time: b.purchase_time, shortcode: b.shortcode, balance_after: b.balance_after }, audit: { freqs: best ? best.freqs.map(x => +x.toFixed(4)) : a ? a.ores.per.map(x => +x.obs.toFixed(4)) : [], consensus: best ? best.agree : a ? a.ores.agree : 0, n: a ? a.n : 0, entropy: a && a.big ? +a.big.ent.toFixed(3) : null, comps: best ? best.pts : a ? a.ores.pts : null, execMs: Math.round(performance.now() - t0) }, feedEpoch: S.feedEpoch };
      S.trades.push(tr); S.openMap.set(tr.id, tr); DB.put('trades', tr); S.risk.onOpen(tr.id, tr.stake); saveRisk(); S.lastExec[intent.strategy] = now();
      if (Number.isFinite(Number(b.balance_after))) { S.acct.balance = Number(b.balance_after); Bus.emit('BALANCE_UPDATED'); }
      Bus.emit('TRADE_OPENED', tr); Alert.fire('executed', 'Trade executed', (tr.strategy === 'DIFFERS' ? 'DIFFERS ' + tr.target : 'OVER 2') + ' · ' + money(tr.stake) + ' · #' + tr.contractId + (intent.source === 'auto' ? ' · AUTO' : ''), 'info');
      Mon.subscribe(tr); Prop.request(p0, true).catch(() => { });
      return { ok: true, trade: tr };
    } catch (e) { const h = humanError(e); Dev.log('err', 'buy', 0, e.message); Alert.fire('blocked', 'BUY ERROR', h.text === e.message ? 'Contract could not be purchased: ' + e.message : h.text, 'neg'); return { ok: false, reason: e.message }; }
    finally { S.execLock = false; }
  }
};

/* ---------- Contract monitor ---------- */
const Mon = {
  recs: new Map(),
  subscribe(tr) {
    if (!Prop.onTrade()) return; if (Mon.recs.has(tr.id)) { S.tradeWs.forget(Mon.recs.get(tr.id)); }
    const sub = S.tradeWs.sub({ proposal_open_contract: 1, contract_id: tr.contractId, subscribe: 1 }, m => Mon.onPOC(m)); Mon.recs.set(tr.id, sub.rec);
    sub.promise.catch(e => { if (/NotFound|InvalidContract|ContractNotFound/i.test(e.code || '')) { tr.status = 'unknown'; tr.note = 'Contract not found on this account — check the statement.'; DB.put('trades', tr); S.openMap.delete(tr.id); S.risk.open.delete(tr.id); Bus.emit('TRADE_UPDATED', tr); } });
  },
  onPOC(m) {
    const c = m.proposal_open_contract; if (!c || !c.contract_id) return; const tr = S.openMap.get(String(c.contract_id)); if (!tr || tr.settled) return;
    tr.bid = Number(c.bid_price); tr.profit = Number(c.profit); tr.spot = c.current_spot; tr.entrySpot = c.entry_spot; tr.validToSell = c.is_valid_to_sell === 1; tr.tickCount = c.tick_count; tr.tickPassed = c.tick_stream ? c.tick_stream.length : tr.tickPassed; tr.dateExpiry = c.date_expiry; tr.pocStatus = c.status;
    Bus.emit('TRADE_UPDATED', tr);
    if (c.is_sold === 1 || c.is_expired === 1 && (c.status === 'won' || c.status === 'lost') || ['won', 'lost', 'sold', 'cancelled'].includes(c.status)) Mon.settle(tr, c);
  },
  settle(tr, c) {
    if (tr.settled) return; tr.settled = true;
    let pl = Number(c.profit); if (!Number.isFinite(pl)) { const sp = Number(c.sell_price); pl = Number.isFinite(sp) ? sp - tr.stake : (c.status === 'won' ? tr.payout - tr.stake : -tr.stake); }
    tr.pl = pl; tr.status = 'closed'; tr.closeTs = now(); tr.result = pl > 0 ? 'WIN' : 'LOSS'; tr.exitSpot = c.exit_spot; tr.sellPrice = Number(c.sell_price);
    if (c.exit_spot != null) { const dec = S.market.dec; const q = Number(c.exit_spot); if (Number.isFinite(q)) tr.exitDigit = Digit.of(q, Math.max(dec, String(c.exit_spot).split('.')[1] ? String(c.exit_spot).split('.')[1].length : 0)); }
    S.openMap.delete(tr.id); const rec = Mon.recs.get(tr.id); if (rec && S.tradeWs) S.tradeWs.forget(rec); Mon.recs.delete(tr.id);
    S.risk.onClose(tr.id, pl, tr.acct); saveRisk(); DB.put('trades', tr);
    Bus.emit('TRADE_CLOSED', tr); Alert.fire(pl > 0 ? 'won' : 'lost', pl > 0 ? 'Trade won' : 'Trade lost', (tr.strategy === 'DIFFERS' ? 'DIFFERS ' + tr.target : 'OVER 2') + ' · ' + (pl > 0 ? '+' : '') + money(pl) + ' · exit digit ' + (tr.exitDigit != null ? tr.exitDigit : '?'), pl > 0 ? 'pos' : 'neg');
    Cycle.check(); Signals.update();
  },
  async sell(id) { const tr = S.openMap.get(String(id)); if (!tr || !Prop.onTrade()) return; try { const r = await S.tradeWs.send({ sell: tr.contractId, price: 0 }); Dev.log('sell', 'in', 0, r.sell || {}); Alert.fire('executed', 'Sell requested', 'Contract #' + tr.contractId, 'info'); } catch (e) { Alert.fire('blocked', 'SELL ERROR', humanError(e).text, 'neg'); } },
  restore() { for (const tr of S.trades) if (tr.status === 'open' && tr.mode !== 'paper' && tr.acctId === S.acct.id) { S.openMap.set(tr.id, tr); tr.settled = false; if (!S.risk.open.has(tr.id)) S.risk.open.set(tr.id, tr.stake); Mon.subscribe(tr); } }
};

/* ---------- Trade connection (PAT → REST accounts → OTP → authenticated WebSocket) ---------- */
const TradeConn = {
  async connect() {
    const c = S.creds; S.conn.error = null;
    if (!c.appId.trim() || !c.pat.trim()) { S.conn.error = { title: 'MISSING CREDENTIALS', text: 'Enter your Deriv App ID and PAT.' }; Bus.emit('CONNECTION_CHANGED', { name: 'trade', status: 'ERROR' }); return false; }
    c.appId = c.appId.trim(); c.pat = c.pat.trim();
    S.conn.trade.status = 'CONNECTING'; Bus.emit('CONNECTION_CHANGED', { name: 'trade', status: 'CONNECTING' });
    try {
      let list = await Rest.accounts(); let pick = null;
      const want = c.mode;
      if (c.accountId.trim()) pick = list.find(a => a.account_id === c.accountId.trim());
      if (!pick) pick = list.find(a => a.account_type === want && a.status === 'active') || list.find(a => a.account_type === want);
      if (!pick && want === 'demo') pick = await Rest.createAccount('demo');
      if (!pick) throw Object.assign(new Error('No ' + want + ' Options account found for this token.'), { code: 'AccountNotFound' });
      if (pick.account_type && pick.account_type !== want) throw Object.assign(new Error('Account ' + pick.account_id + ' is a ' + pick.account_type + ' account but ' + want.toUpperCase() + ' mode is selected.'), { code: 'ModeMismatch' });
      S.acct = { id: pick.account_id, type: pick.account_type || want, currency: pick.currency || 'USD', balance: Number(pick.balance), name: pick.account_id };
      c.accountId = pick.account_id; Bus.emit('BALANCE_UPDATED');
    } catch (e) { const h = humanError(e); S.conn.error = h; S.conn.trade.status = 'ERROR'; Bus.emit('CONNECTION_CHANGED', { name: 'trade', status: 'ERROR' }); Alert.fire('lost_conn', h.title, h.text, 'neg'); return false; }
    if (!S.tradeWs) S.tradeWs = new WSClient('trade', async () => { try { return await Rest.otpUrl(S.acct.id); } catch (e) { e.fatal = e.fatal || e.status === 401 || e.status === 403; throw e; } }, { onOpen: re => TradeConn.onOpen(re) });
    S.tradeWs.close(); S.tradeWs.open(); return true;
  },
  async onOpen(re) {
    const ws = S.tradeWs; S.holdUntil = now() + S.cfg.risk.revalidateSec * 1000;
    if (re) Alert.fire('restored', 'Connection restored', 'Trade socket back online — auto trading re-validates before the next order', 'pos');
    ws.sub({ balance: 1, subscribe: 1 }, m => { const b = m.balance; if (b && Number.isFinite(Number(b.balance))) { S.acct.balance = Number(b.balance); if (b.currency) S.acct.currency = b.currency; Bus.emit('BALANCE_UPDATED'); } }).promise.catch(e => Dev.log('err', 'balance', 0, e.message));
    try { const pf = await ws.send({ portfolio: 1 }); const open = (pf.portfolio && pf.portfolio.contracts) || []; for (const c of open) { const id = String(c.contract_id); if (!S.openMap.has(id) && !S.trades.some(t => t.id === id)) { const tr = { id, contractId: c.contract_id, ts: (c.purchase_time || 0) * 1000, mode: acctKey(), source: 'external', acct: acctKey(), acctId: S.acct.id, symbol: c.underlying_symbol, strategy: /DIGITDIFF/.test(c.contract_type) ? 'DIFFERS' : /DIGITOVER/.test(c.contract_type) ? 'OVER2' : c.contract_type, target: null, stake: Number(c.buy_price), payout: Number(c.payout), ratio: Number(c.payout) / Number(c.buy_price), score: null, status: 'open', longcode: c.longcode }; S.trades.push(tr); } } } catch (e) { Dev.log('err', 'portfolio', 0, e.message); }
    Mon.restore(); Prop.warm(); Bus.emit('TRADE_CONNECTED');
  },
  disconnect() { Cycle.disarm('Disconnected'); if (S.tradeWs) S.tradeWs.close(); S.acct.id = null; Bus.emit('BALANCE_UPDATED'); Bus.emit('CONNECTION_CHANGED', { name: 'trade', status: 'DISCONNECTED' }); }
};

/* ---------- Auto cycle engine: two-phase, in-place reset/restart (never drops sockets) ---------- */
const Cycle = {
  arm() {
    if (S.risk.kill) return false; if (S.cfg.trading.mode !== 'auto') return false;
    S.autoArmed = true; S.cycle = { phase: 'RUNNING', reason: '', restartAt: 0 }; S.risk.cyclePhase = 'RUNNING'; Wake.on(); Bus.emit('CYCLE_CHANGED'); Signals.update(); return true;
  },
  disarm(why) { const was = S.autoArmed; S.autoArmed = false; S.cycle = { phase: 'IDLE', reason: why || '', restartAt: 0 }; S.risk.cyclePhase = 'RUNNING'; if (was) Alert.fire('blocked', 'AUTO TRADING OFF', why || 'Disarmed', 'neg'); Bus.emit('CYCLE_CHANGED'); Signals.update(); },
  check() {
    if (!S.autoArmed) return; const R = S.cfg.risk, rk = S.risk, C = S.cycle, cyc = S.cfg.cycle;
    if (C.phase === 'RUNNING') {
      let why = ''; if (R.sessionTP > 0 && rk.sessionPnL >= R.sessionTP) why = 'Session take-profit reached'; else if (R.sessionSL > 0 && rk.sessionPnL <= -R.sessionSL) why = 'Session stop-loss reached'; else if (rk.sessionTrades >= R.maxTrades) why = 'Max trades per session reached'; else if (rk.consec >= R.maxConsecLosses) why = 'Max consecutive losses reached'; else if (rk.dailyFor(acctKey()) <= -R.maxDailyLoss) why = 'Daily loss limit reached';
      if (why) { C.phase = 'WINDING_DOWN'; C.reason = why; rk.cyclePhase = 'WINDING_DOWN'; Alert.fire('blocked', 'CYCLE PHASE 1', why + ' — new entries blocked, waiting for open contracts', 'info'); Bus.emit('CYCLE_CHANGED'); }
    }
    if (C.phase === 'WINDING_DOWN' && rk.open.size === 0) {
      const hard = rk.dailyFor(acctKey()) <= -R.maxDailyLoss;
      if (hard || !cyc.autoRestart || rk.cycles >= cyc.maxCycles) { C.phase = 'STOPPED'; rk.cyclePhase = 'STOPPED'; S.autoArmed = false; Alert.fire('blocked', 'AUTO STOPPED', hard ? 'Daily loss limit — no restart today' : 'Cycle complete — auto trading disarmed', 'neg'); }
      else { C.phase = 'RESTARTING'; C.restartAt = now() + cyc.restartDelaySec * 1000; rk.cyclePhase = 'RESTARTING'; }
      Bus.emit('CYCLE_CHANGED');
    }
    if (C.phase === 'RESTARTING' && now() >= C.restartAt) {
      rk.resetSession(); rk.cycles++; C.phase = 'RUNNING'; C.reason = ''; rk.cyclePhase = 'RUNNING'; S.holdUntil = now() + R.revalidateSec * 1000; saveRisk();
      Alert.fire('executed', 'CYCLE ' + rk.cycles + ' RESTARTED', 'Session counters reset in place · connection untouched', 'pos'); Bus.emit('CYCLE_CHANGED');
    }
  }
};
const Kill = {
  engage() { S.risk.kill = true; S.autoArmed = false; S.cycle = { phase: 'IDLE', reason: 'Kill switch', restartAt: 0 }; S.risk.cyclePhase = 'RUNNING'; S.props.clear(); for (const ws of [S.tradeWs, Feed.ws]) if (ws && ws.ready) ws.send({ forget_all: 'proposal' }, { quiet: true }).catch(() => { }); Alert.fire('blocked', 'KILL SWITCH ENGAGED', 'No new trades. Open contracts stay monitored.', 'neg'); Bus.emit('CYCLE_CHANGED'); Signals.update(); },
  release() { S.risk.kill = false; Alert.fire('restored', 'Kill switch released', 'Auto trading stays OFF until you arm it again', 'info'); Bus.emit('CYCLE_CHANGED'); Prop.warm(); Signals.update(); }
};

/* ---------- Alerts: visual + audio + browser + vibration ---------- */
const Sound = {
  ctx: null,
  unlock() { try { if (!Sound.ctx) Sound.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); } catch { } },
  tone(seq) { const c = Sound.ctx; if (!c || c.state !== 'running') return; const vol = S.cfg.notify.volume; if (vol <= 0) return; let t = c.currentTime; for (const [f, d, type] of seq) { const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25 * vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.85; } },
  play(name) { const M = { signal: [[660, .09], [880, .12]], proposal: [[740, .08]], executed: [[520, .07, 'square'], [780, .1, 'square']], won: [[523, .1], [659, .1], [784, .16]], lost: [[300, .18, 'sawtooth'], [220, .24, 'sawtooth']], blocked: [[240, .16, 'square'], [240, .16, 'square']], lost_conn: [[400, .14], [280, .2]], restored: [[440, .08], [660, .1]], error: [[200, .25, 'sawtooth']] }; if (M[name]) Sound.tone(M[name]); }
};
const Alert = {
  last: new Map(),
  fire(evt, title, body, kind) {
    const k = evt + title + body, t = now(); if (t - (Alert.last.get(k) || 0) < 1500) return; Alert.last.set(k, t);
    const N = S.cfg.notify; const ev = N.events[evt]; if (ev === false) { S.events.unshift({ ts: t, evt, title, body, kind, muted: true }); return; }
    S.events.unshift({ ts: t, evt, title, body, kind }); if (S.events.length > 200) S.events.length = 200;
    Bus.emit('ALERT', { evt, title, body, kind: kind || 'info' });
    if (N.audio) Sound.play(evt); if (N.vibrate && navigator.vibrate && /won|lost|blocked|executed|lost_conn/.test(evt)) { try { navigator.vibrate(evt === 'lost' || evt === 'blocked' ? [90, 60, 90] : 40); } catch { } }
    if (N.browser && 'Notification' in window && Notification.permission === 'granted' && (document.hidden || evt === 'won' || evt === 'lost')) {
      const opt = { body, tag: 'de-' + evt, icon: undefined, badge: undefined, renotify: true };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r => { if (r) r.showNotification('DIGIT EDGE · ' + title, opt); else try { new Notification('DIGIT EDGE · ' + title, opt); } catch { } }).catch(() => { }); else try { new Notification('DIGIT EDGE · ' + title, opt); } catch { }
    }
  },
  async askBrowser() { if (!('Notification' in window)) return 'unsupported'; try { return await Notification.requestPermission(); } catch { return 'denied'; } }
};

/* ---------- Watchdog: stale ticks, half-open sockets, cycle timers, revalidation ---------- */
const Watchdog = {
  start() {
    setInterval(() => {
      const M = S.market, t = now(), stale = S.cfg.risk.staleSec * 1000;
      if (M.tickTs) { const age = t - M.tickTs; const st = age > stale ? 'STALE' : 'LIVE'; if (st !== M.state) { M.state = st; Bus.emit('MARKET_STATE'); if (st === 'STALE') Alert.fire('lost_conn', 'Market data stale', 'No tick for ' + Math.round(age / 1000) + 's', 'neg'); } if (age > stale * 3 && Feed.ws.ready) { Dev.log('conn', 'err', 0, 'stale feed — bouncing socket'); Feed.ws.bounce(); M.tickTs = t; } }
      if (S.tradeWs && S.tradeWs.ready && t - S.conn.trade.lastMsg > 75000) { Dev.log('conn', 'err', 0, 'trade socket silent — bouncing'); S.tradeWs.bounce(); }
      if (Feed.ws.ready && t - S.conn.pub.lastMsg > 75000) Feed.ws.bounce();
      Cycle.check(); if (S.autoArmed || S.sig.DIFFERS) Signals.update();
      Bus.emit('TICKER');
    }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.autoArmed) Wake.on(); if (Feed.ws.ready && S.market.tickTs && now() - S.market.tickTs > 20000) Feed.reseed(); Prop.warm(); } });
  }
};
Bus.on('CONNECTION_CHANGED', ({ name, status }) => {
  if (name === 'trade' && status === 'CONNECTED') { Alert.fire('restored', 'Trade socket connected', S.acct.type.toUpperCase() + ' · ' + S.acct.id, 'pos'); }
  if (status === 'RECONNECTING' || (status === 'ERROR' && name === 'trade')) Alert.fire('lost_conn', name === 'pub' ? 'Market feed lost' : 'Trade connection lost', 'Reconnecting with backoff…', 'neg');
  if (name === 'pub' && status === 'CONNECTED' && Feed.ws.everOpen && S.conn.pub.reconnects > 0) Alert.fire('restored', 'Market feed restored', 'Re-seeding history to close any gap', 'pos');
});

function fitCanvas(cv) { const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return null; if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); } const c = cv.getContext && cv.getContext('2d'); if (!c) return null; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h); return { c, w, h }; }
function drawTick() {
  const f = fitCanvas($('cv-tick')); if (!f || !S.buf.len) return; const { c, w, h } = f, n = Math.min(120, S.buf.len), q = S.buf.lastQuotes(n), d = S.buf.last(n);
  let lo = Infinity, hi = -Infinity; for (const x of q) { if (x < lo) lo = x; if (x > hi) hi = x; } const pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad; const X = i => 8 + i * (w - 16) / Math.max(1, n - 1), Y = v => h - 14 - (v - lo) / (hi - lo) * (h - 28);
