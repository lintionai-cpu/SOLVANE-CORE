/* ============================================================
   UI CONTROLLER
   ============================================================ */
const UI = {
  state: {
    screen: 'dashboard',
    authenticated: false,
    account: null,
    accounts: [],
    symbols: [],
    pendingManualTrade: null,
  },

  api: null,
  risk: null,
  storage: null,
  executor: null,
  orchestrator: null,

  async init() {
    document.getElementById('screens').innerHTML = Screens.authGate();
    this.storage = new Storage();
    await this.storage.open();

    const savedAppId = await this.storage.get('settings', 'appId');
    if (savedAppId) document.getElementById('inputAppId').value = savedAppId.value;

    // handle OAuth redirect return (new system uses ?code=&state=, not ?acct1=&token1=)
    if (location.search.includes('code=')) {
      await this._handleOAuthReturn();
    }

    this._wireGlobalEvents();
  },

  toast(message, type = 'info') {
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 4000);
  },

  log(message, level = 'info') {
    // mirrors to diagnostics panel + optionally toasts on warn/danger/success
    const panel = document.getElementById('diagnosticsPanel');
    if (panel) {
      const time = new Date().toLocaleTimeString();
      const colorMap = { info: 'var(--text-dim)', warn: 'var(--notouch)', danger: 'var(--danger)', success: 'var(--touch)' };
      const line = document.createElement('div');
      line.innerHTML = `<span style="color:var(--text-faint)">${time}</span> <span style="color:${colorMap[level] || colorMap.info}">${message}</span>`;
      if (panel.querySelector('.muted')) panel.innerHTML = '';
      panel.prepend(line);
      while (panel.children.length > 60) panel.removeChild(panel.lastChild);
    }
    if (level === 'warn' || level === 'danger' || level === 'success') this.toast(message, level);
    console.log(`[TNT-APE][${level}]`, message);
  },

  // ---------------- AUTH FLOW ----------------
  async startOAuth() {
    const appId = document.getElementById('inputAppId').value.trim();
    const clientId = document.getElementById('inputClientId').value.trim() || appId;
    if (!appId) return this.toast('Enter your Deriv App ID first', 'warn');
    await this.storage.put('settings', { key: 'appId', value: appId });
    await this.storage.put('settings', { key: 'clientId', value: clientId });

    const redirectUri = location.origin + location.pathname;
    const tempApi = new DerivAPIService({ appId, clientId });
    const url = await tempApi.buildOAuthUrl(redirectUri);
    document.getElementById('authStatus').textContent = 'Redirecting to Deriv…';
    window.location.href = url;
  },

  async _handleOAuthReturn() {
    if (!window.location.search.includes('code=')) return;
    const savedAppId = (await this.storage.get('settings', 'appId'))?.value;
    const savedClientId = (await this.storage.get('settings', 'clientId'))?.value || savedAppId;
    if (!savedAppId) return; // nothing to resume — App ID was lost (e.g. storage cleared)

    document.getElementById('authStatus').innerHTML = '<span class="spinner"></span> Completing sign-in…';
    const redirectUri = location.origin + location.pathname;
    const tempApi = new DerivAPIService({ appId: savedAppId, clientId: savedClientId });

    try {
      await tempApi.exchangeOAuthCode(redirectUri);
      history.replaceState({}, '', location.pathname); // clean ?code=&state= from URL
      await this._afterTokenObtained(tempApi, 'oauth');
    } catch (err) {
      document.getElementById('authStatus').innerHTML = `<span style="color:var(--danger)">OAuth exchange failed: ${err.message}</span>`;
      this.log(`OAuth exchange failed: ${err.message}`, 'danger');
    }
  },

  async usePAT() {
    const appId = document.getElementById('inputAppId').value.trim();
    const clientId = document.getElementById('inputClientId').value.trim() || appId;
    const pat = document.getElementById('inputPAT').value.trim();
    if (!appId) return this.toast('Enter your Deriv App ID first', 'warn');
    if (!pat) return this.toast('Paste a Personal Access Token', 'warn');
    await this.storage.put('settings', { key: 'appId', value: appId });
    await this.storage.put('settings', { key: 'clientId', value: clientId });

    const tempApi = new DerivAPIService({ appId, clientId });
    tempApi.setPAT(pat);
    await this._afterTokenObtained(tempApi, 'pat');
  },

  // Common path once we have a Bearer token (PAT or OAuth JWT), regardless of method:
  // list accounts via REST, then let the user pick which one to open a session on.
  async _afterTokenObtained(tempApi, method) {
    document.getElementById('authStatus').innerHTML = '<span class="spinner"></span> Loading accounts…';
    this._pendingApi = tempApi;
    this._pendingAuthMethod = method;
    try {
      const res = await tempApi.getAccounts();
      const accounts = res.data || res.accounts || [];
      if (accounts.length === 0) {
        document.getElementById('authStatus').innerHTML = '<span style="color:var(--danger)">No accounts found on this token.</span>';
        return;
      }
      this.state.accounts = accounts;
      if (accounts.length === 1) {
        await this.selectAccountAndConnect(accounts[0].account_id || accounts[0].loginid);
      } else {
        const overlay = document.getElementById('modalOverlay');
        overlay.innerHTML = `<div class="modal-sheet">${Screens.accountPicker(accounts)}</div>`;
        overlay.classList.add('open');
        document.getElementById('authStatus').textContent = 'Choose an account to continue.';
      }
    } catch (err) {
      document.getElementById('authStatus').innerHTML = `<span style="color:var(--danger)">Failed to load accounts: ${err.message}</span>`;
      this.log(`getAccounts failed: ${err.message}`, 'danger');
    }
  },

  // Called from the account picker: requests an OTP for the chosen account and
  // opens the actual trading WebSocket session against it.
  async selectAccountAndConnect(accountId) {
    this.closeModal();
    document.getElementById('authStatus').innerHTML = '<span class="spinner"></span> Opening trading session…';

    this.api = this._pendingApi;
    this.risk = new RiskEngine();
    this.executor = new TradeExecutor({ api: this.api, risk: this.risk, storage: this.storage, logger: (m, l) => this.log(m, l) });
    this.orchestrator = new EngineOrchestrator({ api: this.api, risk: this.risk, executor: this.executor, storage: this.storage, logger: (m, l) => this.log(m, l) });
    this._wireApiEvents();

    try {
      await this.api.connect({ mode: 'authenticated', accountId });
      const balanceRes = await this.api.getBalance();
      const acctMeta = this.state.accounts.find(a => (a.account_id || a.loginid) === accountId) || {};

      this.state.account = {
        loginid: accountId,
        balance: balanceRes.balance?.balance ?? 0,
        currency: balanceRes.balance?.currency ?? acctMeta.currency ?? 'USD',
        is_virtual: this.api.wsEndpointType === 'demo',
      };

      this.risk.setBalance(this.state.account.balance);
      await this._loadSymbols();
      this._mountMainApp();
      this.log(`Session opened on ${accountId} (${this.api.wsEndpointType.toUpperCase()}) via ${this.api.authMethod.toUpperCase()}`, 'success');
    } catch (err) {
      document.getElementById('authStatus').innerHTML = `<span style="color:var(--danger)">Connection failed: ${err.message}</span>`;
      this.log(`Connect failed: ${err.message}`, 'danger');
    }
  },

  // Known synthetic-index underlying_symbol prefixes — these codes are stable
  // across both the legacy and new Deriv API (confirmed via 1HZ100V, R_50, R_100
  // appearing unchanged in every current Deriv example). Used only to pick a
  // sensible *default* group to highlight — never to hide anything.
  _SYNTHETIC_PREFIXES: ['R_', '1HZ', 'BOOM', 'CRASH', 'JD', 'RDBULL', 'RDBEAR', 'STP', 'WLD'],

  _looksLikeSyntheticIndex(s) {
    const code = (s.underlying_symbol || '').toUpperCase();
    const type = (s.underlying_symbol_type || s.market || '').toLowerCase();
    if (type.includes('synthetic') || type.includes('continuous')) return true;
    return this._SYNTHETIC_PREFIXES.some(p => code.startsWith(p));
  },

  // Renders a grouped, searchable symbol picker instead of a flat <select> —
  // groups by whatever market/category value the API actually returns, so the
  // UI never depends on guessing a single filter string correctly.
  async _loadSymbols() {
    const select = document.getElementById('symbolSelect');
    try {
      const res = await this.api.getActiveSymbols();
      const all = res.active_symbols || [];

      if (all.length === 0) {
        this.log('active_symbols returned zero symbols — check account/landing company access', 'danger');
        this.state.symbols = [];
        if (select) select.innerHTML = '<option value="">No markets available</option>';
        return;
      }

      this.state.symbols = all;
      const synthetic = all.filter(s => this._looksLikeSyntheticIndex(s));
      const groups = new Map(); // groupLabel -> symbols[]
      if (synthetic.length > 0) groups.set('Volatility / Synthetic Indices', synthetic);

      const rest = all.filter(s => !synthetic.includes(s));
      rest.forEach(s => {
        const label = s.market || s.underlying_symbol_type || 'Other';
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(s);
      });

      if (select) {
        let html = '<option value="">Select market…</option>';
        for (const [label, syms] of groups) {
          html += `<optgroup label="${label} (${syms.length})">`;
          html += syms.map(s => `<option value="${s.underlying_symbol}">${s.underlying_symbol_name || s.underlying_symbol}</option>`).join('');
          html += '</optgroup>';
        }
        select.innerHTML = html;
      }

      if (synthetic.length === 0) {
        const distinctTypes = [...new Set(all.map(s => s.underlying_symbol_type || s.market))];
        this.log(`No symbols matched synthetic-index detection. Categories present: ${distinctTypes.join(', ')}. Showing all ${all.length} markets grouped below — pick a Volatility/Boom/Crash style symbol manually.`, 'warn');
      } else {
        this.log(`Loaded ${all.length} symbols (${synthetic.length} synthetic indices)`, 'success');
      }
    } catch (e) {
      this.log(`Failed to load symbol list: ${e.message || JSON.stringify(e)}`, 'warn');
      if (select) select.innerHTML = '<option value="">Failed to load — retry below</option>';
    }
  },

  logout() {
    if (this.api) this.api.disconnect();
    this.state.authenticated = false;
    this.state.account = null;
    document.getElementById('screens').innerHTML = Screens.authGate();
    this.toast('Disconnected', 'info');
  },

  // ---------------- MAIN APP MOUNT ----------------
  _mountMainApp() {
    document.getElementById('screens').innerHTML =
      Screens.dashboard() + Screens.signals() + Screens.positions() + Screens.history() + Screens.settings();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-dashboard').classList.add('active');

    this._renderAccountChip();
    this._renderSettingsAccount();
    this._renderConnDot('live');
    this._bindSymbolSelect();
    this._refreshHistoryScreen();
    this._subscribeBalanceStream();
  },

  switchScreen(name) {
    this.state.screen = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const screenEl = document.getElementById(`screen-${name}`);
    if (screenEl) screenEl.classList.add('active');
    const tabEl = document.querySelector(`.tab[data-screen="${name}"]`);
    if (tabEl) tabEl.classList.add('active');
    if (name === 'history') this._refreshHistoryScreen();
    if (name === 'positions') this._refreshPositionsScreen();
  },

  _renderConnDot(status) {
    const dot = document.getElementById('connDot');
    const label = document.getElementById('connLabel');
    if (!dot) return;
    dot.className = `brand-dot ${status}`;
    const labels = { live: 'Connected', connecting: 'Reconnecting…', error: 'Connection error', '': 'Disconnected' };
    label.textContent = labels[status] || 'Disconnected';
    const settingsConn = document.getElementById('settingsConnStatus');
    if (settingsConn) settingsConn.textContent = labels[status] || 'Disconnected';
  },

  _renderAccountChip() {
    const acc = this.state.account;
    if (!acc) return;
    document.getElementById('acctTag').className = acc.is_virtual ? 'demo-tag' : 'real-tag';
    document.getElementById('acctTag').textContent = acc.is_virtual ? 'DEMO' : 'REAL';
    document.getElementById('acctBalance').textContent = `${acc.balance} ${acc.currency}`;
  },

  _renderSettingsAccount() {
    const acc = this.state.account;
    if (!acc) return;
    document.getElementById('settingsLoginId').textContent = acc.loginid;
    document.getElementById('settingsAuthMethod').textContent = this.api.authMethod?.toUpperCase() || '—';
    document.getElementById('settingsCurrency').textContent = acc.currency;
    const epEl = document.getElementById('settingsEndpointType');
    if (epEl) epEl.textContent = this.api.wsEndpointType ? this.api.wsEndpointType.toUpperCase() : '—';
  },
};


/* ============================================================
   UI CONTROLLER (Part 2): dashboard rendering, trades, events
   ============================================================ */
Object.assign(UI, {

  async refreshMarkets() {
    this.toast('Refreshing markets…', 'info');
    await this._loadSymbols();
  },

  _bindSymbolSelect() {
    const select = document.getElementById('symbolSelect');
    select.addEventListener('change', async (e) => {
      const symbol = e.target.value;
      if (!symbol) return;
      try {
        await this.api.unsubscribeAll();
      } catch (err) { /* ignore */ }
      await this.orchestrator.startSymbol(symbol);
      this.orchestrator.onCycle = (snapshot) => this._renderDashboard(snapshot);
      this.log(`Subscribed to ${symbol} tick stream`, 'info');
    });
  },

  applyTradeConfig() {
    const offset = parseFloat(document.getElementById('barrierOffset').value);
    const duration = parseInt(document.getElementById('durationVal').value, 10);
    const durationUnit = document.getElementById('durationUnit').value;
    if (!this.orchestrator) return;
    this.orchestrator.barrierOffset = isNaN(offset) ? null : offset;
    this.orchestrator.duration = isNaN(duration) ? 5 : duration;
    this.orchestrator.durationUnit = durationUnit;
    this.orchestrator.currency = this.state.account?.currency || 'USD';
    this.toast('Trade configuration applied', 'success');
  },

  toggleAutoExecute(enabled) {
    if (!this.executor) return;
    if (enabled) {
      // require explicit secondary confirmation for auto-execution
      this._confirmAutoExecute();
    } else {
      this.executor.setAutoExecute(false);
      document.getElementById('autoExecStatusLabel').textContent = 'OFF';
    }
  },

  _confirmAutoExecute() {
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Enable Auto-Execution?</div>
        <div class="tiny muted" style="margin-top:8px;line-height:1.5;">
          The bot will place real trades automatically whenever a signal passes validation AND the risk engine allows it. Hard limits (drawdown, consecutive losses, max stake) stay enforced and cannot be bypassed from here.
        </div>
        <div class="grid-2" style="margin-top:16px;">
          <button class="btn btn-ghost" onclick="UI._cancelAutoExecute()">Cancel</button>
          <button class="btn btn-primary" onclick="UI._acceptAutoExecute()">Enable</button>
        </div>
      </div>`;
    overlay.classList.add('open');
  },

  _cancelAutoExecute() {
    document.getElementById('autoExecToggle').checked = false;
    this.closeModal();
  },

  _acceptAutoExecute() {
    this.executor.setAutoExecute(true);
    document.getElementById('autoExecStatusLabel').textContent = 'ON';
    this.closeModal();
  },

  manualTrade(signalType) {
    if (!this.orchestrator || !this.orchestrator.symbol) return this.toast('Select a symbol first', 'warn');
    const stake = this.risk.stakeSize();
    this.state.pendingManualTrade = {
      signal: signalType,
      label: signalType === 'BUY_TOUCH' ? 'Touch Trade' : 'No Touch Trade',
      symbol: this.orchestrator.symbol,
      stake,
      currency: this.orchestrator.currency,
      duration: this.orchestrator.duration,
      durationUnit: this.orchestrator.durationUnit,
      barrier: this.orchestrator.barrierOffset,
    };
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `<div class="modal-sheet">${Screens.tradeConfirmSheet(this.state.pendingManualTrade)}</div>`;
    overlay.classList.add('open');
  },

  async confirmManualTrade() {
    const t = this.state.pendingManualTrade;
    if (!t) return;
    this.closeModal();
    const marketCtx = {
      symbol: t.symbol, barrierOffset: t.barrier, duration: t.duration,
      durationUnit: t.durationUnit, currency: t.currency,
      currentPrice: this.orchestrator.buf.last,
      touchScore: null, confidence: null, marketState: this.orchestrator.stateMachine.state,
    };
    const gate = this.risk.canTrade(this.orchestrator.tickIndex);
    if (!gate.allowed) {
      return this.toast(`Blocked by risk engine: ${gate.blockers.join('; ')}`, 'danger');
    }
    const result = await this.executor.execute({ signal: t.signal }, marketCtx, this.orchestrator.tickIndex);
    if (result.executed) this.toast('Trade placed', 'success');
  },

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalOverlay').innerHTML = '';
  },

  openAccountSheet() {
    if (!this.state.accounts.length) return;
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `<div class="modal-sheet">${Screens.accountSheet()}</div>`;
    const list = overlay.querySelector('#accountSheetList');
    list.innerHTML = this.state.accounts.map(a => {
      const id = a.account_id || a.loginid;
      const isDemo = a.account_type === 'demo' || a.is_virtual;
      return `
      <div class="card row" style="cursor:pointer;" onclick="UI.switchAccount('${id}')">
        <div>
          <div class="bold tiny">${id}</div>
          <div class="faint tiny">${a.currency || ''}</div>
        </div>
        <span class="badge ${isDemo ? 'badge-neutral' : 'badge-touch'}">${isDemo ? 'DEMO' : 'REAL'}</span>
      </div>`;
    }).join('');
    overlay.classList.add('open');
  },

  // Same Bearer token, different account: the new API just needs a fresh OTP
  // for the target accountId — no separate per-account token to track.
  async switchAccount(accountId) {
    try {
      const balanceRes = await this.api.switchAccount(accountId);
      const acctMeta = this.state.accounts.find(a => (a.account_id || a.loginid) === accountId) || {};
      this.state.account = {
        loginid: accountId,
        balance: balanceRes.balance?.balance ?? 0,
        currency: balanceRes.balance?.currency ?? acctMeta.currency ?? 'USD',
        is_virtual: this.api.wsEndpointType === 'demo',
      };
      this.risk.resetDay(this.state.account.balance);
      this._renderAccountChip();
      this._renderSettingsAccount();
      this.closeModal();
      this.toast(`Switched to ${accountId} (${this.api.wsEndpointType.toUpperCase()})`, 'success');
    } catch (e) {
      this.toast(`Failed to switch account: ${e.message}`, 'danger');
    }
  },

  saveRiskConfig() {
    if (!this.risk) return;
    const risk = parseFloat(document.getElementById('riskPerTrade').value) || 1.0;
    const dd = parseFloat(document.getElementById('riskDailyDD').value) || 5.0;
    const losses = parseInt(document.getElementById('riskMaxLosses').value, 10) || 3;
    const cooldown = parseInt(document.getElementById('riskCooldown').value, 10) || 30;
    this.risk.config.riskPerTradePct = Math.min(risk, this.risk.config.maxRiskPerTradePct);
    this.risk.config.dailyDrawdownPct = dd;
    this.risk.config.maxConsecutiveLosses = losses;
    this.risk.config.cooldownMinutesAfterTrigger = cooldown;
    this.toast('Risk settings saved', 'success');
  },

  setTradeBias(value) {
    if (this.orchestrator) this.orchestrator.tradeBias = value;
  },

  // ---------------- DASHBOARD RENDERING ----------------
  _renderDashboard(snap) {
    const priceEl = document.getElementById('lastPrice');
    if (priceEl) priceEl.textContent = snap.price.toFixed(4);

    const stateBadge = document.getElementById('marketStateBadge');
    const stateColorMap = {
      TRENDING: 'badge-touch', BREAKOUT: 'badge-touch', EXHAUSTED: 'badge-notouch',
      HIGH_RISK: 'badge-danger', COMPRESSED: 'badge-warn', REVERSING: 'badge-neutral', IDLE: 'badge-neutral',
    };
    if (stateBadge) stateBadge.innerHTML = `<span class="badge ${stateColorMap[snap.marketState] || 'badge-neutral'}">${snap.marketState}</span>`;
    const behaviorEl = document.getElementById('stateBehavior');
    if (behaviorEl) behaviorEl.textContent = snap.behavior.entry;

    const volBadge = document.getElementById('volZoneBadge');
    const volColorMap = { LOW: 'badge-neutral', MEDIUM: 'badge-warn', HIGH: 'badge-notouch', EXTREME: 'badge-danger' };
    if (volBadge) volBadge.innerHTML = `<span class="badge ${volColorMap[snap.volatilityZone]}">${snap.volatilityZone}</span>`;
    const distEl = document.getElementById('distanceInfo');
    if (distEl) distEl.textContent = snap.distance ? `Ratio ${snap.distance.ratio.toFixed(2)} · ${snap.distance.zone}` : 'Set a barrier offset to see distance.';

    document.getElementById('touchMeter').style.width = `${(snap.probabilities.touchScore * 100).toFixed(0)}%`;
    document.getElementById('touchScoreLabel').textContent = fmtPct(snap.probabilities.touchScore);
    document.getElementById('notouchMeter').style.width = `${(snap.probabilities.noTouchScore * 100).toFixed(0)}%`;
    document.getElementById('notouchScoreLabel').textContent = fmtPct(snap.probabilities.noTouchScore);

    const bandColorMap = { NO_TRADE: 'badge-neutral', WEAK: 'badge-warn', MODERATE: 'badge-notouch', STRONG: 'badge-touch' };
    document.getElementById('decisionBandBadge').className = `badge ${bandColorMap[snap.band]}`;
    document.getElementById('decisionBandBadge').textContent = snap.band.replace('_', ' ');
    document.getElementById('patternLabel').textContent = snap.pattern.pattern.replace('MARKET_', '');

    document.getElementById('stakePreview').textContent = `Stake: ${this.risk.stakeSize()} ${this.state.account?.currency || ''}`;

    this._renderRiskBanner();
    this._renderDiagnostics(snap);

    if (snap.signal) this._pushSignalFeed(snap);
  },

  _renderRiskBanner() {
    const el = document.getElementById('riskBanner');
    if (!el || !this.risk) return;
    const gate = this.risk.canTrade(this.orchestrator?.tickIndex || 0);
    if (!gate.allowed) {
      el.innerHTML = `<div class="banner danger"><span>⛔</span><span>${gate.blockers.join(' · ')}</span></div>`;
    } else if (this.risk.drawdownPct() > this.risk.config.dailyDrawdownPct * 0.6) {
      el.innerHTML = `<div class="banner warn"><span>⚠</span><span>Drawdown at ${this.risk.drawdownPct().toFixed(1)}% — approaching daily limit of ${this.risk.config.dailyDrawdownPct}%</span></div>`;
    } else {
      el.innerHTML = '';
    }
  },

  _renderDiagnostics(snap) {
    // lightweight always-on diagnostics line at top, log() handles the scroll history
    const panel = document.getElementById('diagnosticsPanel');
    if (!panel) return;
  },

  _pushSignalFeed(snap) {
    const feed = document.getElementById('signalFeed');
    if (!feed) return;
    if (feed.querySelector('.empty-state')) feed.innerHTML = '';
    const isTouch = snap.signal.signal === 'BUY_TOUCH';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="row">
        <span class="badge ${isTouch ? 'badge-touch' : 'badge-notouch'}">${snap.signal.signal.replace('BUY_', '')}</span>
        <span class="tiny faint">${new Date(snap.time).toLocaleTimeString()}</span>
      </div>
      <div class="row" style="margin-top:8px;">
        <span class="tiny muted">Price</span><span class="mono tiny">${snap.price.toFixed(4)}</span>
      </div>
      <div class="row">
        <span class="tiny muted">Score</span><span class="mono tiny">${fmtPct(isTouch ? snap.probabilities.touchScore : snap.probabilities.noTouchScore)}</span>
      </div>
      <div class="row">
        <span class="tiny muted">State</span><span class="mono tiny">${snap.marketState}</span>
      </div>`;
    feed.prepend(card);
    while (feed.children.length > 30) feed.removeChild(feed.lastChild);
  },

  // ---------------- POSITIONS / HISTORY ----------------
  async _refreshPositionsScreen() {
    const list = document.getElementById('positionsList');
    if (!list || !this.executor) return;
    const active = Array.from(this.executor.activeContracts.values());
    if (active.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="ic">▤</div><div class="t">No open positions</div><div class="s">Active contracts will appear here with live P/L.</div></div>`;
      return;
    }
    list.innerHTML = active.map(p => `
      <div class="card">
        <div class="row">
          <span class="badge ${p.tradeType === 'TOUCH' ? 'badge-touch' : 'badge-notouch'}">${p.tradeType}</span>
          <span class="tiny faint">${p.market}</span>
        </div>
        <div class="row" style="margin-top:8px;"><span class="tiny muted">Stake</span><span class="mono tiny">${p.stake}</span></div>
        <div class="row"><span class="tiny muted">Entry</span><span class="mono tiny">${p.entryPrice}</span></div>
      </div>`).join('');
  },

  async _refreshHistoryScreen() {
    if (!this.storage) return;
    const trades = (await this.storage.getAll('trades')).filter(t => t.result !== 'pending').sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const wins = trades.filter(t => t.result === 'win');
    const losses = trades.filter(t => t.result === 'loss');
    const winRate = trades.length ? wins.length / trades.length : 0;
    const grossWin = wins.reduce((a, t) => a + t.profit, 0);
    const grossLoss = Math.abs(losses.reduce((a, t) => a + t.profit, 0));
    const pf = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
    const totalPnl = trades.reduce((a, t) => a + t.profit, 0);

    const winRateEl = document.getElementById('statWinRate');
    if (winRateEl) winRateEl.textContent = trades.length ? fmtPct(winRate) : '—';
    const pfEl = document.getElementById('statProfitFactor');
    if (pfEl) pfEl.textContent = trades.length ? (pf === Infinity ? '∞' : pf.toFixed(2)) : '—';
    const pnlEl = document.getElementById('statTotalPnl');
    if (pnlEl) { pnlEl.textContent = trades.length ? totalPnl.toFixed(2) : '—'; pnlEl.style.color = totalPnl >= 0 ? 'var(--touch)' : 'var(--danger)'; }

    const logEl = document.getElementById('tradeLog');
    if (logEl) {
      if (trades.length === 0) {
        logEl.innerHTML = `<div class="empty-state"><div class="ic">≡</div><div class="t">No trades yet</div><div class="s">Settled trades will be logged here.</div></div>`;
      } else {
        logEl.innerHTML = trades.slice(0, 40).map(t => `
          <div class="card row">
            <div>
              <div class="tiny bold">${t.market} · ${t.tradeType}</div>
              <div class="tiny faint">${new Date(t.timestamp).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="badge ${t.result === 'win' ? 'badge-touch' : 'badge-danger'}">${t.result.toUpperCase()}</div>
              <div class="mono tiny" style="margin-top:4px;">${t.profit >= 0 ? '+' : ''}${t.profit.toFixed(2)}</div>
            </div>
          </div>`).join('');
      }
    }

    const proposals = (await this.storage.getAll('weightProposals')).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const propEl = document.getElementById('learningProposals');
    if (propEl) {
      if (proposals.length === 0) {
        propEl.innerHTML = `<div class="empty-state"><div class="ic">◈</div><div class="t">No proposals yet</div><div class="s">Generated every 100 settled trades from out-of-sample performance.</div></div>`;
      } else {
        propEl.innerHTML = proposals.map(p => `
          <div class="card">
            <div class="row">
              <span class="tiny bold">Sample: ${p.sampleSize} trades</span>
              <span class="badge ${p.status === 'pending_review' ? 'badge-warn' : p.status === 'applied' ? 'badge-touch' : 'badge-neutral'}">${p.status.replace('_', ' ')}</span>
            </div>
            <div class="tiny muted" style="margin-top:6px;">Win rate ${fmtPct(p.winRate)} · EV ${p.ev.toFixed(3)}</div>
            <div class="tiny faint" style="margin-top:4px;">${p.rationale.join(' ')}</div>
            ${p.status === 'pending_review' ? `
              <div class="grid-2" style="margin-top:10px;">
                <button class="btn btn-ghost btn-sm" onclick="UI._rejectProposal(${p.id})">Reject</button>
                <button class="btn btn-primary btn-sm" onclick="UI._applyProposal(${p.id})">Approve</button>
              </div>` : ''}
          </div>`).join('');
      }
    }
  },

  async _applyProposal(id) {
    const p = await this.storage.get('weightProposals', id);
    if (!p) return;
    await this.orchestrator.learning.applyProposal(p);
    this._refreshHistoryScreen();
  },
  async _rejectProposal(id) {
    const p = await this.storage.get('weightProposals', id);
    if (!p) return;
    await this.orchestrator.learning.rejectProposal(p);
    this._refreshHistoryScreen();
  },

  // ---------------- EVENT WIRING ----------------
  _subscribeBalanceStream() {
    this.api.subscribeBalance((msg) => {
      if (msg.balance) {
        this.state.account.balance = msg.balance.balance;
        this.risk.setBalance(msg.balance.balance);
        this._renderAccountChip();
      }
    });
  },

  _wireApiEvents() {
    this.api.addEventListener('connected', () => this._renderConnDot('live'));
    this.api.addEventListener('disconnected', () => this._renderConnDot(''));
    this.api.addEventListener('reconnecting', (e) => {
      this._renderConnDot('connecting');
      const el = document.getElementById('settingsReconnectCount');
      if (el) el.textContent = e.detail.attempt;
      this.log(`Reconnecting (attempt ${e.detail.attempt})…`, 'warn');
    });
    this.api.addEventListener('reconnected', () => {
      this._renderConnDot('live');
      this.log('Reconnected — subscriptions restored', 'success');
    });
    this.api.addEventListener('reconnect_failed', () => {
      this._renderConnDot('error');
      this.log('Reconnection failed after max attempts. Reconnect manually.', 'danger');
    });
    this.api.addEventListener('error', () => this._renderConnDot('error'));
  },

  _wireGlobalEvents() {
    document.addEventListener('tnt:trade-settled', () => {
      this._refreshHistoryScreen();
      this._refreshPositionsScreen();
    });
    document.addEventListener('tnt:execution-result', (e) => {
      if (e.detail.requiresManualConfirm) {
        // surfaced via signal feed already; no action needed
      }
    });
  },
});

document.addEventListener('DOMContentLoaded', () => UI.init());

</script>
</body>
</html>
