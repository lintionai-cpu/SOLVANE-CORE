<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>TNT-APE · Touch/No Touch Engine</title>
<style>
:root{
  /* design tokens */
  --bg:#0b0f17;
  --bg-elevated:#11161f;
  --bg-card:#151b26;
  --bg-card-hi:#1b2330;
  --border:#232b3a;
  --border-hi:#2e3a4f;
  --text:#e7ecf3;
  --text-dim:#8d98ab;
  --text-faint:#5b6577;

  --accent:#3da8ff;
  --accent-dim:#2a3f57;

  --touch:#22c55e;
  --touch-dim:#16321f;
  --notouch:#f59e0b;
  --notouch-dim:#3a2c12;

  --danger:#ef4444;
  --danger-dim:#3a1c1c;
  --warn:#f59e0b;

  --mono:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;

  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);

  --tabbar-h:64px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{
  width:100%;
  min-height:100vh;
  overflow-x:hidden;
  font-size:15px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-dim);}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  background:linear-gradient(to bottom, rgba(11,15,23,0.97), rgba(11,15,23,0.88));
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.topbar .brand{display:flex;align-items:center;gap:8px;}
.topbar .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--text-faint);transition:background .3s;}
.topbar .brand-dot.live{background:var(--touch);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite;}
.topbar .brand-dot.connecting{background:var(--notouch);animation:pulse 1s infinite;}
.topbar .brand-dot.error{background:var(--danger);}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.45);}
  70%{box-shadow:0 0 0 6px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}
.topbar .title{font-weight:700;font-size:15px;letter-spacing:.2px;}
.topbar .title small{display:block;font-size:10.5px;font-weight:500;color:var(--text-dim);letter-spacing:.4px;}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-dim);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;
}
.icon-btn:active{background:var(--bg-card-hi);}

/* account chip */
.acct-chip{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg-card);
  font-size:12px;color:var(--text-dim);font-family:var(--mono);
  cursor:pointer;
}
.acct-chip b{color:var(--text);font-weight:600;}
.acct-chip .demo-tag{background:var(--accent-dim);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.acct-chip .real-tag{background:var(--touch-dim);color:var(--touch);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.3px;}

/* ---------- Main scroll area ---------- */
.screen{
  flex:1;
  padding:14px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px);
  display:none;
  animation:fadein .18s ease;
}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.section-label{
  font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--text-faint);
  text-transform:uppercase;margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;
}
.section-label .hint{font-weight:500;color:var(--text-faint);text-transform:none;letter-spacing:0;font-size:11px;}

.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
}
.card-flat{padding:0;overflow:hidden;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.row + .row{margin-top:8px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.mono{font-family:var(--mono);}
.tiny{font-size:11.5px;}
.bold{font-weight:700;}

/* buttons */
.btn{
  appearance:none;border:none;border-radius:var(--radius-sm);
  padding:13px 16px;font-size:14.5px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;min-height:46px;
  transition:transform .08s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#06121f;}
.btn-ghost{background:var(--bg-card-hi);color:var(--text);border:1px solid var(--border-hi);}
.btn-danger{background:var(--danger-dim);color:#ffb4b4;border:1px solid #4a2222;}
.btn-touch{background:var(--touch-dim);color:var(--touch);border:1px solid #1c4a2c;}
.btn-notouch{background:var(--notouch-dim);color:var(--notouch);border:1px solid #5a4218;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;min-height:34px;border-radius:8px;}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;
}
.badge-touch{background:var(--touch-dim);color:var(--touch);}
.badge-notouch{background:var(--notouch-dim);color:var(--notouch);}
.badge-neutral{background:var(--bg-card-hi);color:var(--text-dim);}
.badge-danger{background:var(--danger-dim);color:#ff9b9b;}
.badge-warn{background:#3a2c12;color:#f5c542;}

/* ---------- Bottom tab bar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  max-width:480px;margin:0 auto;
  height:calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:rgba(17,22,31,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;z-index:50;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-faint);font-size:10.5px;font-weight:600;letter-spacing:.2px;
  background:none;border:none;cursor:pointer;padding:6px 0;
}
.tab .ic{font-size:19px;line-height:1;}
.tab.active{color:var(--accent);}

/* ---------- Toast / modal ---------- */
.toast-stack{
  position:fixed;top:calc(var(--safe-top) + 56px);left:0;right:0;
  max-width:480px;margin:0 auto;z-index:200;
  display:flex;flex-direction:column;gap:8px;padding:0 16px;pointer-events:none;
}
.toast{
  background:var(--bg-card-hi);border:1px solid var(--border-hi);border-radius:12px;
  padding:11px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.toast.warn{border-color:#5a4218;background:#241c0d;}
.toast.danger{border-color:#4a2222;background:#241010;}
.toast.success{border-color:#1c4a2c;background:#0f1f15;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-sheet{
  width:100%;max-width:480px;background:var(--bg-elevated);
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-bottom));
  max-height:85vh;overflow-y:auto;
  border-top:1px solid var(--border-hi);
  animation:sheetup .22s ease;
}
@keyframes sheetup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:36px;height:4px;background:var(--border-hi);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px;}

/* empty / loading states */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;color:var(--text-faint);
}
.empty-state .ic{font-size:32px;margin-bottom:10px;opacity:.6;}
.empty-state .t{font-size:13.5px;color:var(--text-dim);font-weight:600;}
.empty-state .s{font-size:12px;margin-top:4px;}

.skeleton{background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hi) 37%,var(--bg-card) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

.spinner{
  width:16px;height:16px;border-radius:50%;border:2px solid var(--border-hi);border-top-color:var(--accent);
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* form fields */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
.field input,.field select{
  width:100%;background:var(--bg-card-hi);border:1px solid var(--border-hi);border-radius:10px;
  padding:11px 12px;color:var(--text);font-size:14px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:5px;}

.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--bg-card-hi);border:1px solid var(--border-hi);border-radius:14px;transition:.2s;cursor:pointer;}
.switch .thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--text-dim);border-radius:50%;transition:.2s;}
.switch input:checked + .track{background:var(--accent-dim);border-color:var(--accent);}
.switch input:checked + .track .thumb{transform:translateX(18px);background:var(--accent);}

/* utility grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* probability meter bars */
.meter{height:8px;border-radius:5px;background:var(--bg-card-hi);overflow:hidden;position:relative;}
.meter-fill{height:100%;border-radius:5px;transition:width .4s ease;}
.meter-fill.touch{background:linear-gradient(90deg,#16a34a,var(--touch));}
.meter-fill.notouch{background:linear-gradient(90deg,#b45309,var(--notouch));}

/* connection banner */
.banner{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;margin-bottom:10px;
}
.banner.warn{background:#241c0d;border:1px solid #5a4218;color:#f5c542;}
.banner.danger{background:#241010;border:1px solid #4a2222;color:#ff9b9b;}
.banner.info{background:#0f1a2b;border:1px solid #1f3a57;color:#7cc4ff;}

a{color:var(--accent);text-decoration:none;}
hr.sep{border:none;border-top:1px solid var(--border);margin:12px 0;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">

  <div class="toast-stack" id="toastStack"></div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot" id="connDot"></span>
      <div class="title">TNT-APE<small id="connLabel">Disconnected</small></div>
    </div>
    <div class="actions">
      <div class="acct-chip" id="acctChip" onclick="UI.openAccountSheet()">
        <span id="acctTag" class="demo-tag">DEMO</span>
        <b id="acctBalance">—</b>
      </div>
    </div>
  </div>

  <!-- SCREENS MOUNT HERE -->
  <div id="screens"></div>

  <!-- TAB BAR -->
  <div class="tabbar">
    <button class="tab active" data-screen="dashboard" onclick="UI.switchScreen('dashboard')">
      <span class="ic">◎</span>Dashboard
    </button>
    <button class="tab" data-screen="signals" onclick="UI.switchScreen('signals')">
      <span class="ic">⚡</span>Signals
    </button>
    <button class="tab" data-screen="positions" onclick="UI.switchScreen('positions')">
      <span class="ic">▤</span>Positions
    </button>
    <button class="tab" data-screen="history" onclick="UI.switchScreen('history')">
      <span class="ic">≡</span>History
    </button>
    <button class="tab" data-screen="settings" onclick="UI.switchScreen('settings')">
      <span class="ic">⚙</span>Settings
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay"></div>
</div>
<script>
/* ============================================================
   MODULE 1 — TICK BUFFER ENGINE
   Maintains rolling windows of live market memory.
   ============================================================ */
class TickBuffer {
  constructor(maxLen = 200) {
    this.maxLen = maxLen;
    this.prices = [];
    this.timestamps = [];
    this.highs = [];
    this.lows = [];
  }

  addTick(price, time) {
    this.prices.push(price);
    this.timestamps.push(time);
    this.highs.push(price);
    this.lows.push(price);
    if (this.prices.length > this.maxLen) {
      this.prices.shift();
      this.timestamps.shift();
      this.highs.shift();
      this.lows.shift();
    }
  }

  getWindow(n) {
    const len = this.prices.length;
    const start = Math.max(0, len - n);
    return {
      prices: this.prices.slice(start),
      timestamps: this.timestamps.slice(start),
      highs: this.highs.slice(start),
      lows: this.lows.slice(start),
    };
  }

  calculateRange(n) {
    const w = this.getWindow(n);
    if (w.prices.length === 0) return 0;
    return Math.max(...w.highs) - Math.min(...w.lows);
  }

  get length() { return this.prices.length; }
  get last() { return this.prices[this.prices.length - 1]; }
  get prev() { return this.prices[this.prices.length - 2]; }
  isReady(min = 20) { return this.prices.length >= min; }
}

/* ============================================================
   MODULE 2 — FEATURE GENERATION ENGINE
   Pure functions producing numeric features from tick windows.
   All math is plain descriptive statistics — NOT a predictive
   model. Treat outputs as inputs to a heuristic, not ground truth.
   ============================================================ */
const Features = {
  delta(buf) {
    if (buf.length < 2) return 0;
    return buf.last - buf.prev;
  },

  velocity(buf) {
    if (buf.length < 2) return 0;
    const dt = (buf.timestamps[buf.timestamps.length - 1] - buf.timestamps[buf.timestamps.length - 2]) / 1000;
    if (dt <= 0) return 0;
    return Math.abs(buf.last - buf.prev) / dt;
  },

  acceleration(history) {
    // history: array of recent velocity values, most recent last
    if (history.length < 2) return 0;
    return history[history.length - 1] - history[history.length - 2];
  },

  stdDev(arr) {
    if (arr.length < 2) return 0;
    const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
    const variance = arr.reduce((a, b) => a + (b - mean) ** 2, 0) / arr.length;
    return Math.sqrt(variance);
  },

  volatility(buf, n = 20) {
    const w = buf.getWindow(n);
    return Features.stdDev(w.prices);
  },

  ema(arr, period) {
    if (arr.length === 0) return 0;
    const k = 2 / (period + 1);
    let emaVal = arr[0];
    for (let i = 1; i < arr.length; i++) {
      emaVal = arr[i] * k + emaVal * (1 - k);
    }
    return emaVal;
  },

  trendStrength(buf) {
    if (buf.length < 10) return 0;
    const ema10 = Features.ema(buf.getWindow(10).prices, 10);
    const ema50 = Features.ema(buf.getWindow(Math.min(50, buf.length)).prices, 50);
    return ema10 - ema50;
  },

  rsi(buf, period = 14) {
    const w = buf.getWindow(period + 1);
    if (w.prices.length < 2) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i < w.prices.length; i++) {
      const diff = w.prices[i] - w.prices[i - 1];
      if (diff > 0) gains += diff; else losses -= diff;
    }
    const avgGain = gains / period, avgLoss = losses / period;
    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
  },

  atr(buf, period = 14) {
    const w = buf.getWindow(period + 1);
    if (w.prices.length < 2) return Features.stdDev(buf.getWindow(20).prices) || 1;
    let trSum = 0;
    for (let i = 1; i < w.highs.length; i++) {
      const tr = Math.max(
        w.highs[i] - w.lows[i],
        Math.abs(w.highs[i] - w.prices[i - 1]),
        Math.abs(w.lows[i] - w.prices[i - 1])
      );
      trSum += tr;
    }
    return trSum / (w.highs.length - 1) || 1;
  },

  barrierDistanceRatio(currentPrice, barrier, atrValue) {
    if (!barrier || !atrValue) return null;
    const distance = Math.abs(barrier - currentPrice);
    const ratio = distance / atrValue;
    let zone;
    if (ratio < 0.5) zone = 'EXTREMELY_CLOSE';
    else if (ratio < 1) zone = 'NEAR';
    else if (ratio < 2) zone = 'MEDIUM';
    else zone = 'FAR';
    return { distance, ratio, zone };
  },

  bollinger(buf, period = 20, sd = 2) {
    const w = buf.getWindow(period).prices;
    if (w.length < 2) return { upper: 0, lower: 0, mid: 0, width: 0 };
    const mean = w.reduce((a, b) => a + b, 0) / w.length;
    const std = Features.stdDev(w);
    return { upper: mean + sd * std, lower: mean - sd * std, mid: mean, width: (2 * sd * std) };
  },

  wickRatio(highs, lows, opens, closes) {
    // simplistic candle wick estimate from tick highs/lows over a window
    if (!highs.length) return { upper: 0, lower: 0, body: 0 };
    const open = opens[0], close = closes[closes.length - 1];
    const high = Math.max(...highs), low = Math.min(...lows);
    const body = Math.abs(close - open);
    return {
      upper: high - Math.max(open, close),
      lower: Math.min(open, close) - low,
      body,
    };
  },
};

/* ============================================================
   MODULE 3 — PATTERN DETECTION LAYER
   ============================================================ */
const PatternDetector = {
  detect(buf, velocityHistory, volatilityHistory) {
    if (!buf.isReady(50)) return { pattern: 'INSUFFICIENT_DATA', confidence: 0 };

    const range20 = buf.calculateRange(20);
    const range50 = buf.calculateRange(50);
    const avgVelocity = velocityHistory.length
      ? velocityHistory.reduce((a, b) => a + b, 0) / velocityHistory.length : 0;
    const currentVelocity = velocityHistory[velocityHistory.length - 1] || 0;
    const volIncreasing = volatilityHistory.length >= 2 &&
      volatilityHistory[volatilityHistory.length - 1] > volatilityHistory[volatilityHistory.length - 2];
    const accelHistory = velocityHistory.map((v, i, arr) => i === 0 ? 0 : v - arr[i - 1]);
    const lastAccel = accelHistory[accelHistory.length - 1] || 0;
    const fallingVelocity = velocityHistory.length >= 3 &&
      velocityHistory[velocityHistory.length - 1] < velocityHistory[velocityHistory.length - 3];

    // Compression
    if (range20 < range50 * 0.5) {
      return { pattern: 'MARKET_COMPRESSED', confidence: clamp01(1 - range20 / (range50 * 0.5 + 1e-9)) };
    }
    // Expansion
    if (currentVelocity > avgVelocity * 1.15 && volIncreasing) {
      return { pattern: 'MARKET_EXPANDING', confidence: clamp01(currentVelocity / (avgVelocity * 2 + 1e-9)) };
    }
    // Exhaustion
    if (fallingVelocity && lastAccel < 0) {
      return { pattern: 'MARKET_EXHAUSTED', confidence: clamp01(Math.abs(lastAccel) / (avgVelocity + 1e-9)) };
    }
    // Mean reversion fallback check
    const ema10 = Features.ema(buf.getWindow(10).prices, 10);
    const closeToEma = Math.abs(buf.last - ema10) < (range20 * 0.15 + 1e-9);
    if (closeToEma) {
      return { pattern: 'MARKET_REVERSAL', confidence: 0.5 };
    }

    return { pattern: 'MARKET_NEUTRAL', confidence: 0.3 };
  },
};

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


/* ============================================================
   MODULE 4 — MARKET STATE MACHINE
   ============================================================ */
class MarketStateMachine {
  constructor() {
    this.state = 'IDLE';
    this.history = [];
    this.enteredAt = Date.now();
  }

  transition(patternResult, features) {
    const prev = this.state;
    let next = this.state;

    if (features.volatilityZone === 'EXTREME') {
      next = 'HIGH_RISK';
    } else {
      switch (patternResult.pattern) {
        case 'MARKET_COMPRESSED':
          next = 'COMPRESSED';
          break;
        case 'MARKET_EXPANDING':
          next = (prev === 'COMPRESSED') ? 'BREAKOUT' : 'TRENDING';
          break;
        case 'MARKET_EXHAUSTED':
          next = 'EXHAUSTED';
          break;
        case 'MARKET_REVERSAL':
          next = 'REVERSING';
          break;
        default:
          if (prev === 'BREAKOUT' && features.acceleration > 0) next = 'TRENDING';
          else if (prev === 'HIGH_RISK') next = 'IDLE';
          else if (['BREAKOUT', 'TRENDING'].includes(prev) && features.acceleration < 0) next = 'EXHAUSTED';
          break;
      }
    }

    if (next !== prev) {
      this.history.push({ from: prev, to: next, at: Date.now() });
      if (this.history.length > 50) this.history.shift();
      this.enteredAt = Date.now();
    }
    this.state = next;
    return { state: this.state, changed: next !== prev, prev };
  }

  static behaviorFor(state) {
    const map = {
      IDLE: { entry: 'No active signal context.', allowEntries: false, evaluate: 'none' },
      COMPRESSED: { entry: 'Range contracting — energy buildup.', allowEntries: false, evaluate: 'watch' },
      BREAKOUT: { entry: 'Range broken, directional move starting.', allowEntries: true, evaluate: 'touch' },
      TRENDING: { entry: 'Sustained directional movement.', allowEntries: true, evaluate: 'touch' },
      EXHAUSTED: { entry: 'Momentum fading, large wicks.', allowEntries: true, evaluate: 'notouch' },
      REVERSING: { entry: 'Price returning to mean repeatedly.', allowEntries: false, evaluate: 'none' },
      HIGH_RISK: { entry: 'Extreme volatility / anomaly detected.', allowEntries: false, evaluate: 'none' },
    };
    return map[state] || map.IDLE;
  }
}

/* ============================================================
   MODULE 5 — HEURISTIC SCORING ENGINE
   IMPORTANT: this produces a *confidence score*, 0-1, derived
   from a fixed weighted sum of technical features. It is NOT a
   calibrated statistical probability of touching a barrier.
   Synthetic indices are designed random-walk instruments with a
   house edge; no technical weighting here changes that. Treat
   "touchScore" purely as a relative signal-strength heuristic.
   ============================================================ */
const ScoringEngine = {
  weights: {
    velocity: 15,
    acceleration: 10,
    volatility: 15,
    highLowPattern: 15,
    candleStrength: 10,
    ema: 10,
    rsi: 5,
    atr: 10,
    pattern: 10,
  },

  // normalize raw feature to 0-1 using a soft cap so outliers don't blow up the score
  norm(value, softCap) {
    if (softCap <= 0) return 0;
    return clamp01(Math.abs(value) / softCap);
  },

  score(ctx) {
    const w = this.weights;
    const n = {
      velocity: this.norm(ctx.velocity, ctx.velocityCap || 1),
      acceleration: this.norm(ctx.acceleration, ctx.accelCap || 1),
      volatility: this.norm(ctx.volatility, ctx.volCap || 1),
      highLowPattern: ctx.breakStrengthNorm ?? 0,
      candleStrength: ctx.candleStrengthNorm ?? 0,
      ema: ctx.trendAlignment ?? 0, // 0..1, 1 = strongly aligned with trend direction
      rsi: ctx.rsiExtremeNorm ?? 0, // 0..1, how far RSI is from neutral 50
      atr: ctx.atrFavorability ?? 0, // 0..1, derived from distanceRatio fit to trade type
      pattern: ctx.patternConfidence ?? 0,
    };

    const raw =
      n.velocity * w.velocity +
      n.acceleration * w.acceleration +
      n.volatility * w.volatility +
      n.highLowPattern * w.highLowPattern +
      n.candleStrength * w.candleStrength +
      n.ema * w.ema +
      n.rsi * w.rsi +
      n.atr * w.atr +
      n.pattern * w.pattern;

    const totalWeight = Object.values(w).reduce((a, b) => a + b, 0);
    const normalizedScore = clamp01(raw / totalWeight);

    return {
      raw,
      score: normalizedScore,
      breakdown: n,
    };
  },

  // Combine directional bias with raw score to get touch/no-touch split.
  // bias: -1 (favors no-touch / exhaustion) .. +1 (favors touch / expansion)
  toProbabilities(scoreResult, bias) {
    const s = scoreResult.score;
    // confidence = how strong/clean the signal is, independent of direction
    const confidence = s;
    // skew the split by bias, but keep it bounded — this is a heuristic blend, not a model
    const touchLean = clamp01(0.5 + bias * 0.5 * s);
    return {
      touchScore: touchLean,
      noTouchScore: 1 - touchLean,
      confidence,
    };
  },

  decisionBand(score) {
    if (score < 0.40) return 'NO_TRADE';
    if (score < 0.61) return 'WEAK';
    if (score < 0.76) return 'MODERATE';
    return 'STRONG';
  },
};

/* ============================================================
   MODULE 6 — TRADE VALIDATION LAYER
   ============================================================ */
const TradeValidator = {
  evaluateTouch(ctx) {
    const reasons = [];
    const pass =
      ctx.touchScore > 0.75 &&
      ctx.distanceRatio != null && ctx.distanceRatio < 1 &&
      ctx.marketState === 'TRENDING' &&
      ctx.volatilityZone !== 'EXTREME';

    if (ctx.touchScore <= 0.75) reasons.push(`touchScore ${fmtPct(ctx.touchScore)} ≤ 75%`);
    if (ctx.distanceRatio == null || ctx.distanceRatio >= 1) reasons.push('distance ratio not <1');
    if (ctx.marketState !== 'TRENDING') reasons.push(`state is ${ctx.marketState}, not TRENDING`);
    if (ctx.volatilityZone === 'EXTREME') reasons.push('volatility EXTREME');

    return { pass, signal: pass ? 'BUY_TOUCH' : null, reasons };
  },

  evaluateNoTouch(ctx) {
    const reasons = [];
    const pass =
      ctx.noTouchScore > 0.75 &&
      ctx.distanceRatio != null && ctx.distanceRatio > 2 &&
      ctx.marketState === 'EXHAUSTED' &&
      ctx.volatilityZone !== 'HIGH' && ctx.volatilityZone !== 'EXTREME';

    if (ctx.noTouchScore <= 0.75) reasons.push(`noTouchScore ${fmtPct(ctx.noTouchScore)} ≤ 75%`);
    if (ctx.distanceRatio == null || ctx.distanceRatio <= 2) reasons.push('distance ratio not >2');
    if (ctx.marketState !== 'EXHAUSTED') reasons.push(`state is ${ctx.marketState}, not EXHAUSTED`);
    if (ctx.volatilityZone === 'HIGH' || ctx.volatilityZone === 'EXTREME') reasons.push('volatility too high');

    return { pass, signal: pass ? 'BUY_NOTOUCH' : null, reasons };
  },

  rejectionCheck(ctx) {
    const rejects = [];
    if (ctx.volatilityZone === 'EXTREME') rejects.push('Volatility EXTREME');
    if (ctx.touchScore > 0.45 && ctx.touchScore < 0.60) rejects.push('Touch score ambiguous (45-60%)');
    if (ctx.noTouchScore > 0.45 && ctx.noTouchScore < 0.60) rejects.push('No-touch score ambiguous (45-60%)');
    if (ctx.emaCrossoverActive) rejects.push('EMA crossover in progress');
    if (ctx.spikeDetected) rejects.push('Price spike detected');
    return rejects;
  },
};

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }

/* ============================================================
   MODULE 7 — RISK ENGINE
   These limits are hard-enforced gate checks, not suggestions.
   The executor MUST consult RiskEngine.canTrade() before every
   auto-execution and respect its verdict unconditionally.
   ============================================================ */
class RiskEngine {
  constructor(config = {}) {
    this.config = Object.assign({
      riskPerTradePct: 1.0,       // % of balance per trade
      maxRiskPerTradePct: 2.0,    // hard ceiling, UI cannot exceed this
      dailyDrawdownPct: 5.0,      // stop trading for the day past this loss
      maxConsecutiveLosses: 3,
      cooldownMinutesAfterTrigger: 30,
      tradeCooldownTicks: 20,     // avoid re-entry for N ticks after a trade
    }, config);

    this.dayStartBalance = null;
    this.currentBalance = null;
    this.consecutiveLosses = 0;
    this.pausedUntil = null;
    this.pauseReason = null;
    this.lastTradeTickIndex = -Infinity;
    this.tradesToday = [];
  }

  setBalance(balance) {
    if (this.dayStartBalance == null) this.dayStartBalance = balance;
    this.currentBalance = balance;
  }

  resetDay(balance) {
    this.dayStartBalance = balance;
    this.currentBalance = balance;
    this.consecutiveLosses = 0;
    this.tradesToday = [];
    this.pausedUntil = null;
    this.pauseReason = null;
  }

  recordResult(result, profit) {
    this.tradesToday.push({ result, profit, at: Date.now() });
    if (result === 'loss') {
      this.consecutiveLosses++;
    } else if (result === 'win') {
      this.consecutiveLosses = 0;
    }
    if (this.currentBalance != null) this.currentBalance += profit;
    this._checkTriggers();
  }

  _checkTriggers() {
    const ddPct = this.drawdownPct();
    if (ddPct >= this.config.dailyDrawdownPct) {
      this._pause(`Daily drawdown limit hit (${ddPct.toFixed(2)}% ≥ ${this.config.dailyDrawdownPct}%)`);
    }
    if (this.consecutiveLosses >= this.config.maxConsecutiveLosses) {
      this._pause(`${this.consecutiveLosses} consecutive losses ≥ limit of ${this.config.maxConsecutiveLosses}`);
    }
  }

  _pause(reason) {
    this.pausedUntil = Date.now() + this.config.cooldownMinutesAfterTrigger * 60000;
    this.pauseReason = reason;
  }

  drawdownPct() {
    if (!this.dayStartBalance || this.currentBalance == null) return 0;
    const loss = this.dayStartBalance - this.currentBalance;
    return Math.max(0, (loss / this.dayStartBalance) * 100);
  }

  stakeSize() {
    if (!this.currentBalance) return 0;
    const pct = Math.min(this.config.riskPerTradePct, this.config.maxRiskPerTradePct);
    return +(this.currentBalance * (pct / 100)).toFixed(2);
  }

  canTrade(currentTickIndex) {
    const blockers = [];
    if (this.pausedUntil && Date.now() < this.pausedUntil) {
      blockers.push(`Paused: ${this.pauseReason} (resumes ${new Date(this.pausedUntil).toLocaleTimeString()})`);
    } else if (this.pausedUntil && Date.now() >= this.pausedUntil) {
      this.pausedUntil = null;
      this.pauseReason = null;
    }
    if (this.drawdownPct() >= this.config.dailyDrawdownPct) {
      blockers.push('Daily drawdown limit reached');
    }
    if (this.consecutiveLosses >= this.config.maxConsecutiveLosses) {
      blockers.push('Consecutive loss limit reached');
    }
    if (currentTickIndex - this.lastTradeTickIndex < this.config.tradeCooldownTicks) {
      blockers.push(`Trade cooldown active (${this.config.tradeCooldownTicks - (currentTickIndex - this.lastTradeTickIndex)} ticks remaining)`);
    }
    return { allowed: blockers.length === 0, blockers };
  }

  markTradeEntered(tickIndex) {
    this.lastTradeTickIndex = tickIndex;
  }
}


/* ============================================================
   MODULE 8 — DERIV API SERVICE (NEW API, confirmed against
   developers.deriv.com docs — June 2026)
   ------------------------------------------------------------
   API SELECTION RATIONALE (per new architecture):
   - REST  -> app registration is done on developers.deriv.com
             (new App IDs only — legacy App IDs are rejected by
             this API). REST handles: OAuth2 code/PKCE exchange,
             account listing/creation, and — critically — the
             OTP endpoint that mints a short-lived, pre-
             authenticated WebSocket URL.
   - WS    -> everything live/streaming: ticks, proposals,
             buy/sell, balance, portfolio, contract monitoring.
             The socket carries NO `authorize` frame in the new
             system — auth is baked into the OTP query param on
             the URL you connect to.
   Three WS endpoints exist: public (no auth), demo, real — the
   OTP response URL already points at the correct one.
   OTPs are short-lived: a fresh OTP must be requested on every
   connect AND every reconnect, not reused from the first login.
   ============================================================ */

const DerivEndpoints = {
  REST_BASE: 'https://api.derivws.com',
  WS_PUBLIC: 'wss://api.derivws.com/trading/v1/options/ws/public',
  OAUTH_AUTHORIZE: 'https://auth.deriv.com/oauth2/auth',
  OAUTH_TOKEN: 'https://auth.deriv.com/oauth2/token',
};

class DerivAPIService extends EventTarget {
  constructor({ appId, clientId } = {}) {
    super();
    this.appId = appId;                 // new-system App ID from developers.deriv.com
    this.clientId = clientId || appId;  // OAuth client_id (same as App ID for first-party apps)
    this.ws = null;
    this.connected = false;
    this.reqId = 1;
    this.pending = new Map();
    this.subscriptions = new Map();
    this.reconnectAttempts = 0;
    this.maxReconnectAttempts = 8;
    this.heartbeatTimer = null;

    this.authToken = null;        // Bearer token: PAT or OAuth JWT
    this.authMethod = null;       // 'oauth' | 'pat'
    this.accountId = null;        // currently selected loginid/account id
    this.wsEndpointType = null;   // 'public' | 'demo' | 'real'
    this._manualClose = false;
  }

  // ---------------- AUTH: OAuth2 (Authorization Code + PKCE) ----------------
  static async generateCodeVerifier() {
    const array = new Uint8Array(32);
    crypto.getRandomValues(array);
    return btoa(String.fromCharCode(...array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  static async generateCodeChallenge(verifier) {
    const encoder = new TextEncoder();
    const digest = await crypto.subtle.digest('SHA-256', encoder.encode(verifier));
    return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async buildOAuthUrl(redirectUri) {
    const codeVerifier = await DerivAPIService.generateCodeVerifier();
    const codeChallenge = await DerivAPIService.generateCodeChallenge(codeVerifier);
    const state = crypto.randomUUID();

    // PKCE verifier/state must survive the redirect. sessionStorage is fine here —
    // this is a transient proof value for one login round-trip, not an access token.
    sessionStorage.setItem('tnt_code_verifier', codeVerifier);
    sessionStorage.setItem('tnt_oauth_state', state);

    const url = new URL(DerivEndpoints.OAUTH_AUTHORIZE);
    url.searchParams.set('response_type', 'code');
    url.searchParams.set('client_id', this.clientId);
    url.searchParams.set('redirect_uri', redirectUri);
    url.searchParams.set('scope', 'trade account_manage');
    url.searchParams.set('state', state);
    url.searchParams.set('code_challenge', codeChallenge);
    url.searchParams.set('code_challenge_method', 'S256');
    return url.toString();
  }

  // Call on redirect return. Returns { accessToken, expiresIn } or throws.
  async exchangeOAuthCode(redirectUri) {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const returnedState = params.get('state');
    const savedState = sessionStorage.getItem('tnt_oauth_state');
    const codeVerifier = sessionStorage.getItem('tnt_code_verifier');

    if (!code) throw new Error('No authorization code in redirect URL');
    if (returnedState !== savedState) throw new Error('OAuth state mismatch — possible CSRF, aborting');

    const res = await fetch(DerivEndpoints.OAUTH_TOKEN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: this.clientId,
        code,
        redirect_uri: redirectUri,
        code_verifier: codeVerifier,
      }),
    });
    if (!res.ok) throw new Error(`Token exchange failed: HTTP ${res.status}`);
    const data = await res.json();

    sessionStorage.removeItem('tnt_code_verifier');
    sessionStorage.removeItem('tnt_oauth_state');

    this.authToken = data.access_token;
    this.authMethod = 'oauth';
    this._oauthExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
    this._oauthRefreshToken = data.refresh_token || null;
    return { accessToken: data.access_token, expiresIn: data.expires_in };
  }

  // ---------------- AUTH: PAT ----------------
  setPAT(token) {
    this.authToken = token;
    this.authMethod = 'pat';
  }

  _restHeaders(extra = {}) {
    return Object.assign({
      'Authorization': `Bearer ${this.authToken}`,
      'Deriv-App-ID': this.appId,
    }, extra);
  }

  // ---------------- REST: ACCOUNTS ----------------
  async getAccounts() {
    const res = await fetch(`${DerivEndpoints.REST_BASE}/trading/v1/options/accounts`, {
      headers: this._restHeaders(),
    });
    if (!res.ok) throw await this._restError(res);
    return res.json();
  }

  async createAccount({ currency = 'USD', group = 'row', accountType = 'demo' } = {}) {
    const res = await fetch(`${DerivEndpoints.REST_BASE}/trading/v1/options/accounts`, {
      method: 'POST',
      headers: this._restHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ currency, group, account_type: accountType }),
    });
    if (!res.ok) throw await this._restError(res);
    return res.json();
  }

  async resetDemoBalance(accountId) {
    const res = await fetch(`${DerivEndpoints.REST_BASE}/trading/v1/options/accounts/${accountId}/reset-demo-balance`, {
      method: 'POST',
      headers: this._restHeaders(),
    });
    if (!res.ok) throw await this._restError(res);
    return res.json();
  }

  async _restError(res) {
    let body;
    try { body = await res.json(); } catch (e) { body = null; }
    const msg = body?.errors?.[0]?.message || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.body = body;
    return err;
  }

  // ---------------- REST: OTP (the bridge to an authenticated WS) ----------------
  // OTPs are short-lived — call this fresh for every connect AND every reconnect.
  async _requestOtpUrl(accountId) {
    const res = await fetch(`${DerivEndpoints.REST_BASE}/trading/v1/options/accounts/${accountId}/otp`, {
      method: 'POST',
      headers: this._restHeaders(),
    });
    if (!res.ok) throw await this._restError(res);
    const { data } = await res.json();
    return data.url; // wss://.../ws/{demo|real}?otp=...
  }

  // ---------------- CONNECTION ----------------
  // mode: 'public' (no auth, market data only) or 'authenticated' (needs accountId)
  async connect({ mode = 'authenticated', accountId = null } = {}) {
    this._manualClose = false;
    let url;

    if (mode === 'public') {
      url = DerivEndpoints.WS_PUBLIC;
      this.wsEndpointType = 'public';
    } else {
      if (!accountId) throw new Error('accountId required to open an authenticated session');
      if (!this.authToken) throw new Error('No auth token set — call setPAT() or complete OAuth first');
      this.accountId = accountId;
      url = await this._requestOtpUrl(accountId);
      this.wsEndpointType = url.includes('/ws/real') ? 'real' : 'demo';
    }

    return new Promise((resolve, reject) => {
      this.ws = new WebSocket(url);

      this.ws.onopen = () => {
        this.connected = true;
        this.reconnectAttempts = 0;
        this._startHeartbeat();
        this._emit('connected', { endpointType: this.wsEndpointType });
        resolve();
      };
      this.ws.onmessage = (msg) => this._handleMessage(msg);
      this.ws.onerror = (err) => this._emit('error', { error: err });
      this.ws.onclose = () => {
        this.connected = false;
        this._stopHeartbeat();
        this._emit('disconnected');
        if (!this._manualClose) this._scheduleReconnect();
      };

      setTimeout(() => { if (!this.connected) reject(new Error('WebSocket connection timeout')); }, 10000);
    });
  }

  disconnect() {
    this._manualClose = true;
    this._stopHeartbeat();
    if (this.ws) this.ws.close();
  }

  // ---------------- RECONNECTION LOGIC ----------------
  // Socket disconnect -> retry count++ -> exponential backoff ->
  // request a FRESH OTP (old one has expired) -> reconnect ->
  // restore subscriptions -> restore state
  async _scheduleReconnect() {
    if (this.reconnectAttempts >= this.maxReconnectAttempts) {
      this._emit('reconnect_failed');
      return;
    }
    this.reconnectAttempts++;
    const delay = Math.min(30000, 1000 * 2 ** this.reconnectAttempts);
    this._emit('reconnecting', { attempt: this.reconnectAttempts, delay });

    await new Promise(r => setTimeout(r, delay));
    try {
      await this.connect({
        mode: this.wsEndpointType === 'public' ? 'public' : 'authenticated',
        accountId: this.accountId,
      });
      await this._restoreSubscriptions();
      this._emit('reconnected');
    } catch (e) {
      this._scheduleReconnect();
    }
  }

  async _restoreSubscriptions() {
    const subs = Array.from(this.subscriptions.values());
    for (const sub of subs) {
      try { await this.send(sub.request, true); } catch (e) { /* log + continue */ }
    }
  }

  _startHeartbeat() {
    this._stopHeartbeat();
    this.heartbeatTimer = setInterval(() => { this.send({ ping: 1 }).catch(() => {}); }, 20000);
  }
  _stopHeartbeat() { if (this.heartbeatTimer) clearInterval(this.heartbeatTimer); this.heartbeatTimer = null; }

  // ---------------- MESSAGE PLUMBING ----------------
  send(payload, isResubscribe = false) {
    return new Promise((resolve, reject) => {
      if (!this.connected) return reject(new Error('Not connected'));
      const req_id = this.reqId++;
      const body = Object.assign({}, payload, { req_id });
      this.pending.set(req_id, { resolve, reject });
      try { this.ws.send(JSON.stringify(body)); }
      catch (e) { this.pending.delete(req_id); reject(e); }
      setTimeout(() => {
        if (this.pending.has(req_id)) {
          this.pending.delete(req_id);
          if (!isResubscribe) reject(new Error('Request timed out'));
        }
      }, 15000);
    });
  }

  _handleMessage(msg) {
    let data;
    try { data = JSON.parse(msg.data); } catch (e) { return; }

    if (data.req_id && this.pending.has(data.req_id)) {
      const { resolve, reject } = this.pending.get(data.req_id);
      this.pending.delete(data.req_id);
      if (data.error) reject(data.error); else resolve(data);
    }
    if (data.subscription && data.subscription.id) {
      const sub = this.subscriptions.get(data.subscription.id);
      if (sub) sub.callback(data);
    }
    this._emit('message', data);
  }

  _emit(type, detail = {}) { this.dispatchEvent(new CustomEvent(type, { detail })); }

  // ---------------- ACCOUNT / BALANCE (WebSocket, post-OTP) ----------------
  async getBalance() { return this.send({ balance: 1 }); }
  subscribeBalance(callback) { return this._subscribe({ balance: 1, subscribe: 1 }, callback); }
  async getPortfolio() { return this.send({ portfolio: 1 }); }
  async getProfitTable(limit = 50) { return this.send({ profit_table: 1, limit, description: 1 }); }

  // Switching accounts in the new system = requesting a new OTP/socket for
  // the other accountId, not re-sending `authorize` on the same socket.
  async switchAccount(accountId) {
    this.disconnect();
    await this.connect({ mode: 'authenticated', accountId });
    return this.getBalance();
  }

  // ---------------- MARKET DATA ----------------
  // New API: active_symbols no longer accepts product_type / landing_company_short /
  // landing_company / loginid — sending them is what broke this call.
  async getActiveSymbols() { return this.send({ active_symbols: 'brief' }); }
  subscribeTicks(symbol, callback) { return this._subscribe({ ticks: symbol, subscribe: 1 }, callback); }
  async getTickHistory(symbol, count = 200) {
    return this.send({ ticks_history: symbol, count, end: 'latest', style: 'ticks' });
  }

  async _subscribe(request, callback) {
    const res = await this.send(request);
    if (res.subscription && res.subscription.id) {
      this.subscriptions.set(res.subscription.id, { request, callback });
    }
    callback(res);
    return res;
  }

  async unsubscribe(subscriptionId) {
    this.subscriptions.delete(subscriptionId);
    return this.send({ forget: subscriptionId });
  }

  async unsubscribeAll() {
    const ids = Array.from(this.subscriptions.keys());
    this.subscriptions.clear();
    if (ids.length) return this.send({ forget_all: ['ticks', 'proposal_open_contract', 'balance'] });
  }

  // ---------------- TRADING FLOW ----------------
  // proposal() -> buy() -> proposal_open_contract() -> monitor -> save
  // New API: `symbol` request param renamed to `underlying_symbol`; `loginid` removed.
  // contractType must be a real Deriv contract_type enum value: 'ONETOUCH' (not 'TOUCH')
  // or 'NOTOUCH' for this app's use case.
  // barrier must be sent as a signed string (e.g. "+0.50"), not a bare number —
  // this is how every confirmed Deriv example formats relative barriers.
  async requestProposal({ symbol, contractType, barrier, duration, durationUnit, stake, currency }) {
    return this.send({
      proposal: 1,
      amount: stake,
      basis: 'stake',
      contract_type: contractType, // 'ONETOUCH' | 'NOTOUCH'
      currency,
      underlying_symbol: symbol,
      barrier: DerivAPIService.formatBarrier(barrier),
      duration,
      duration_unit: durationUnit, // 't' | 's' | 'm'
    });
  }

  static formatBarrier(value) {
    if (value == null || value === '') return undefined;
    const num = Number(value);
    if (isNaN(num)) return String(value); // already a pre-formatted string, pass through
    return (num >= 0 ? '+' : '') + num.toString();
  }

  async buyContract(proposalId, price) { return this.send({ buy: proposalId, price }); }
  subscribeOpenContract(contractId, callback) {
    return this._subscribe({ proposal_open_contract: 1, contract_id: contractId, subscribe: 1 }, callback);
  }
  async sellContract(contractId, price = 0) { return this.send({ sell: contractId, price }); }

  // ---------------- AUTOMATION (new-system bot primitives) ----------------
  async autoStart(strategyConfig) { return this.send({ auto_start: 1, ...strategyConfig }); }
  async autoPause(strategyId) { return this.send({ auto_pause: strategyId }); }
  async autoResume(strategyId) { return this.send({ auto_resume: strategyId }); }
  async autoStop(strategyId) { return this.send({ auto_stop: strategyId }); }
  async autoList() { return this.send({ auto_list: 1 }); }
}


/* ============================================================
   MODULE 9 — STORAGE LAYER (IndexedDB)
   Per project rules: never store tokens in localStorage.
   Tokens live in memory only for this session; everything else
   (settings, watchlists, trade history, weight-change proposals)
   persists in IndexedDB.
   ============================================================ */
class Storage {
  constructor(dbName = 'tnt_ape_db', version = 1) {
    this.dbName = dbName;
    this.version = version;
    this.db = null;
  }

  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, this.version);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('trades')) {
          const store = db.createObjectStore('trades', { keyPath: 'id' });
          store.createIndex('timestamp', 'timestamp');
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
        if (!db.objectStoreNames.contains('weightProposals')) {
          db.createObjectStore('weightProposals', { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains('watchlist')) {
          db.createObjectStore('watchlist', { keyPath: 'symbol' });
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  _tx(storeName, mode = 'readonly') {
    return this.db.transaction(storeName, mode).objectStore(storeName);
  }

  put(storeName, value) {
    return new Promise((resolve, reject) => {
      const req = this._tx(storeName, 'readwrite').put(value);
      req.onsuccess = () => resolve(value);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  get(storeName, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(storeName).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  getAll(storeName) {
    return new Promise((resolve, reject) => {
      const req = this._tx(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  delete(storeName, key) {
    return new Promise((resolve, reject) => {
      const req = this._tx(storeName, 'readwrite').delete(key);
      req.onsuccess = () => resolve();
      req.onerror = (e) => reject(e.target.error);
    });
  }
}

/* ============================================================
   MODULE 10 — TRADE EXECUTOR
   Auto-execution is permitted ONLY when RiskEngine.canTrade()
   returns allowed:true. This check is not optional and the
   executor does not provide a path to bypass it.
   ============================================================ */
class TradeExecutor {
  constructor({ api, risk, storage, logger }) {
    this.api = api;
    this.risk = risk;
    this.storage = storage;
    this.logger = logger || (() => {});
    this.autoExecuteEnabled = false;
    this.activeContracts = new Map();
  }

  setAutoExecute(enabled) {
    this.autoExecuteEnabled = enabled;
    this.logger(`Auto-execute ${enabled ? 'ENABLED' : 'disabled'}`, enabled ? 'warn' : 'info');
  }

  async tryExecute(signal, marketCtx, tickIndex) {
    // Hard gate — cannot be skipped, regardless of caller.
    const gate = this.risk.canTrade(tickIndex);
    if (!gate.allowed) {
      this.logger(`Signal ${signal.signal} blocked by risk engine: ${gate.blockers.join('; ')}`, 'danger');
      return { executed: false, reason: gate.blockers.join('; ') };
    }
    if (!this.autoExecuteEnabled) {
      this.logger(`Signal ${signal.signal} generated (auto-execute OFF — manual confirm required)`, 'info');
      return { executed: false, reason: 'auto-execute disabled', requiresManualConfirm: true };
    }
    return this.execute(signal, marketCtx, tickIndex);
  }

  async execute(signal, marketCtx, tickIndex) {
    const stake = this.risk.stakeSize();
    if (!stake || stake <= 0) {
      this.logger('Stake calculated as 0 — balance unknown or zero. Aborting.', 'danger');
      return { executed: false, reason: 'invalid stake' };
    }

    // displayType is the internal label used everywhere in UI/storage/learning
    // ('TOUCH'/'NOTOUCH'); wireContractType is what actually goes over the API.
    // Deriv's contract_type enum uses 'ONETOUCH', not 'TOUCH' — sending 'TOUCH'
    // silently fails to produce a valid proposal.
    const displayType = signal.signal === 'BUY_TOUCH' ? 'TOUCH' : 'NOTOUCH';
    const wireContractType = signal.signal === 'BUY_TOUCH' ? 'ONETOUCH' : 'NOTOUCH';

    try {
      const proposal = await this.api.requestProposal({
        symbol: marketCtx.symbol,
        contractType: wireContractType,
        barrier: marketCtx.barrierOffset, // relative barrier offset string, e.g. "+10"
        duration: marketCtx.duration,
        durationUnit: marketCtx.durationUnit,
        stake,
        currency: marketCtx.currency,
      });

      // New API: only `id` is guaranteed on the proposal object — ask_price may be
      // absent, and when present may be a string rather than a number.
      if (!proposal || !proposal.proposal || !proposal.proposal.id) {
        this.logger('Proposal request returned no usable offer — market may be closed.', 'warn');
        return { executed: false, reason: 'no proposal' };
      }
      const askPrice = Number(proposal.proposal.ask_price);
      if (!askPrice || isNaN(askPrice)) {
        this.logger('Proposal missing a valid ask_price — aborting buy.', 'danger');
        return { executed: false, reason: 'invalid ask_price' };
      }

      const bought = await this.api.buyContract(proposal.proposal.id, askPrice);
      this.risk.markTradeEntered(tickIndex);

      const record = {
        id: `${bought.buy.contract_id}`,
        market: marketCtx.symbol,
        tradeType: displayType,
        entryPrice: marketCtx.currentPrice,
        barrier: marketCtx.barrierOffset,
        duration: marketCtx.duration,
        touchProbability: marketCtx.touchScore,
        confidence: marketCtx.confidence,
        marketState: marketCtx.marketState,
        stake,
        result: 'pending',
        profit: 0,
        timestamp: new Date().toISOString(),
      };
      await this.storage.put('trades', record);
      this.activeContracts.set(bought.buy.contract_id, record);

      this.api.subscribeOpenContract(bought.buy.contract_id, (update) => this._onContractUpdate(update));

      this.logger(`Executed ${displayType} on ${marketCtx.symbol} — stake ${stake} ${marketCtx.currency}`, 'success');
      return { executed: true, record, buy: bought.buy };
    } catch (err) {
      this.logger(`Execution failed: ${err.message || err.code || JSON.stringify(err)}`, 'danger');
      return { executed: false, reason: err.message || 'api error' };
    }
  }

  async _onContractUpdate(update) {
    const poc = update.proposal_open_contract;
    if (!poc) return;
    const record = this.activeContracts.get(poc.contract_id);
    if (!record) return;

    if (poc.is_sold || poc.status !== 'open') {
      const profit = poc.profit || 0;
      const result = profit > 0 ? 'win' : 'loss';
      record.result = result;
      record.profit = profit;
      await this.storage.put('trades', record);
      this.risk.recordResult(result, profit);
      this.activeContracts.delete(poc.contract_id);
      this.logger(`Contract ${poc.contract_id} settled: ${result.toUpperCase()} (${profit >= 0 ? '+' : ''}${profit})`, result === 'win' ? 'success' : 'danger');
      document.dispatchEvent(new CustomEvent('tnt:trade-settled', { detail: record }));
    } else {
      document.dispatchEvent(new CustomEvent('tnt:trade-update', { detail: { ...record, livePnl: poc.profit } }));
    }
  }
}

/* ============================================================
   MODULE 11 — ADAPTIVE LEARNING LAYER (manual-review mode)
   ------------------------------------------------------------
   Per design decision: this layer NEVER silently mutates live
   scoring weights. Every 100 trades it computes a *proposed*
   weight/threshold adjustment from out-of-sample performance
   and writes it to a review queue. A human must explicitly
   approve a proposal before ScoringEngine.weights change.
   This avoids overfitting to recent synthetic-market noise.
   ============================================================ */
class AdaptiveLearning {
  constructor({ storage, logger }) {
    this.storage = storage;
    this.logger = logger || (() => {});
    this.evalBatchSize = 100;
  }

  async maybeEvaluate() {
    const trades = (await this.storage.getAll('trades')).filter(t => t.result !== 'pending');
    if (trades.length === 0 || trades.length % this.evalBatchSize !== 0) return null;

    const recent = trades.slice(-this.evalBatchSize);
    const wins = recent.filter(t => t.result === 'win').length;
    const winRate = wins / recent.length;
    const avgWin = avg(recent.filter(t => t.result === 'win').map(t => t.profit)) || 0;
    const avgLoss = Math.abs(avg(recent.filter(t => t.result === 'loss').map(t => t.profit)) || 0);
    const ev = (winRate * avgWin) - ((1 - winRate) * avgLoss);

    const byType = {
      TOUCH: recent.filter(t => t.tradeType === 'TOUCH'),
      NOTOUCH: recent.filter(t => t.tradeType === 'NOTOUCH'),
    };
    const touchAcc = byType.TOUCH.length ? byType.TOUCH.filter(t => t.result === 'win').length / byType.TOUCH.length : null;
    const notouchAcc = byType.NOTOUCH.length ? byType.NOTOUCH.filter(t => t.result === 'win').length / byType.NOTOUCH.length : null;

    const suggestion = { delta: {}, rationale: [] };
    if (winRate < 0.55) {
      suggestion.delta.velocity = +2;
      suggestion.delta.pattern = +3;
      suggestion.rationale.push(`Win rate ${fmtPct(winRate)} < 55% over last ${this.evalBatchSize} trades — proposing increased weight on velocity & pattern confirmation.`);
    } else {
      suggestion.rationale.push(`Win rate ${fmtPct(winRate)} acceptable — no weight change proposed.`);
    }

    const proposal = {
      createdAt: new Date().toISOString(),
      sampleSize: recent.length,
      winRate, avgWin, avgLoss, ev, touchAcc, notouchAcc,
      proposedDelta: suggestion.delta,
      rationale: suggestion.rationale,
      status: 'pending_review',
    };

    await this.storage.put('weightProposals', proposal);
    this.logger(`New adaptive-learning proposal queued for review (sample=${recent.length}, winRate=${fmtPct(winRate)}, EV=${ev.toFixed(3)}). Manual approval required before any weights change.`, 'warn');
    document.dispatchEvent(new CustomEvent('tnt:learning-proposal', { detail: proposal }));
    return proposal;
  }

  async applyProposal(proposal) {
    // Explicit human-approved application only — never called automatically.
    Object.entries(proposal.proposedDelta).forEach(([k, v]) => {
      if (ScoringEngine.weights[k] != null) ScoringEngine.weights[k] += v;
    });
    proposal.status = 'applied';
    await this.storage.put('weightProposals', proposal);
    this.logger('Weight proposal applied by user.', 'success');
  }

  async rejectProposal(proposal) {
    proposal.status = 'rejected';
    await this.storage.put('weightProposals', proposal);
  }
}

function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }


/* ============================================================
   ORCHESTRATOR — wires Deriv tick stream through the full
   engine pipeline to a single onCycle callback per tick.
   ============================================================ */
class EngineOrchestrator {
  constructor({ api, risk, executor, storage, logger }) {
    this.api = api;
    this.risk = risk;
    this.executor = executor;
    this.storage = storage;
    this.logger = logger || (() => {});
    this.learning = new AdaptiveLearning({ storage, logger });

    this.buf = new TickBuffer(200);
    this.velocityHistory = [];
    this.volatilityHistory = [];
    this.tickIndex = 0;
    this.stateMachine = new MarketStateMachine();
    this.symbol = null;
    this.barrierOffset = null;
    this.duration = 5;
    this.durationUnit = 'm';
    this.currency = 'USD';
    this.tradeBias = 'auto'; // 'auto' | 'touch_only' | 'notouch_only'

    this.onCycle = null; // UI hook: (snapshot) => {}
    this._spikeBaseline = null;
  }

  async startSymbol(symbol) {
    this.symbol = symbol;
    this.buf = new TickBuffer(200);
    this.velocityHistory = [];
    this.volatilityHistory = [];
    this.tickIndex = 0;

    const hist = await this.api.getTickHistory(symbol, 200);
    if (hist && hist.history) {
      hist.history.prices.forEach((p, i) => this.buf.addTick(p, hist.history.times[i] * 1000));
    }

    await this.api.subscribeTicks(symbol, (msg) => this._onTick(msg));
  }

  async stopSymbol() {
    // unsubscribe handled by caller via api.unsubscribeAll() to keep this simple
  }

  _onTick(msg) {
    if (!msg.tick) return; // initial subscribe ack with no tick yet
    const price = msg.tick.quote;
    const time = msg.tick.epoch * 1000;
    this.buf.addTick(price, time);
    this.tickIndex++;

    if (!this.buf.isReady(20)) return; // not enough data yet

    const snapshot = this._runCycle();
    if (this.onCycle) this.onCycle(snapshot);

    // adaptive learning check (fire-and-forget, batches of 100 settled trades)
    this.learning.maybeEvaluate();
  }

  _runCycle() {
    const buf = this.buf;
    const velocity = Features.velocity(buf);
    this.velocityHistory.push(velocity);
    if (this.velocityHistory.length > 50) this.velocityHistory.shift();

    const acceleration = Features.acceleration(this.velocityHistory);
    const volatility = Features.volatility(buf, 20);
    this.volatilityHistory.push(volatility);
    if (this.volatilityHistory.length > 50) this.volatilityHistory.shift();

    const atrVal = Features.atr(buf, 14);
    const rsiVal = Features.rsi(buf, 14);
    const trend = Features.trendStrength(buf);
    const boll = Features.bollinger(buf, 20, 2);

    // volatility zone classification (relative to recent history)
    const volSorted = [...this.volatilityHistory].sort((a, b) => a - b);
    const volPct = volSorted.length ? volSorted.indexOf(volatility) / volSorted.length : 0;
    let volatilityZone = 'LOW';
    if (volPct > 0.9) volatilityZone = 'EXTREME';
    else if (volPct > 0.7) volatilityZone = 'HIGH';
    else if (volPct > 0.4) volatilityZone = 'MEDIUM';

    const pattern = PatternDetector.detect(buf, this.velocityHistory, this.volatilityHistory);

    const stateResult = this.stateMachine.transition(pattern, { volatilityZone, acceleration });
    const behavior = MarketStateMachine.behaviorFor(stateResult.state);

    const barrierAbs = this.barrierOffset != null ? buf.last + this.barrierOffset : null;
    const dist = Features.barrierDistanceRatio(buf.last, barrierAbs, atrVal);

    // spike detection: this tick's |delta| vastly exceeds recent average
    const delta = Features.delta(buf);
    const avgVel = avg(this.velocityHistory) || 1;
    const spikeDetected = Math.abs(velocity) > avgVel * 4;

    // EMA crossover flag (simple proxy using trend sign flip)
    this._lastTrendSign = this._lastTrendSign ?? Math.sign(trend);
    const emaCrossoverActive = Math.sign(trend) !== this._lastTrendSign && trend !== 0;
    this._lastTrendSign = Math.sign(trend) || this._lastTrendSign;

    // break strength from recent high/low
    const range20 = buf.calculateRange(20);
    const breakStrengthNorm = clamp01((Math.abs(delta) / (range20 / 20 + 1e-9)) / 3);

    const trendAlignment = clamp01(Math.abs(trend) / (atrVal * 2 + 1e-9));
    const rsiExtremeNorm = clamp01(Math.abs(rsiVal - 50) / 50);
    const atrFavorability = dist ? clamp01(dist.ratio / 3) : 0;

    const scoreCtx = {
      velocity, velocityCap: avgVel * 2 || 1,
      acceleration, accelCap: avgVel || 1,
      volatility, volCap: Math.max(...this.volatilityHistory, 1e-9),
      breakStrengthNorm, candleStrengthNorm: breakStrengthNorm,
      trendAlignment, rsiExtremeNorm, atrFavorability,
      patternConfidence: pattern.confidence,
    };
    const scoreResult = ScoringEngine.score(scoreCtx);

    // bias: positive favors touch (expansion/trending), negative favors no-touch (exhaustion)
    let bias = 0;
    if (['BREAKOUT', 'TRENDING'].includes(stateResult.state)) bias = 0.7;
    else if (stateResult.state === 'EXHAUSTED') bias = -0.7;
    else if (stateResult.state === 'COMPRESSED') bias = 0.2;

    const probs = ScoringEngine.toProbabilities(scoreResult, bias);
    const band = ScoringEngine.decisionBand(scoreResult.score);

    const validationCtx = {
      touchScore: probs.touchScore,
      noTouchScore: probs.noTouchScore,
      distanceRatio: dist ? dist.ratio : null,
      marketState: stateResult.state,
      volatilityZone,
      emaCrossoverActive,
      spikeDetected,
    };

    const touchEval = TradeValidator.evaluateTouch(validationCtx);
    const notouchEval = TradeValidator.evaluateNoTouch(validationCtx);
    const rejections = TradeValidator.rejectionCheck(validationCtx);

    let signal = null;
    if (rejections.length === 0) {
      if (touchEval.pass && this.tradeBias !== 'notouch_only') signal = touchEval;
      else if (notouchEval.pass && this.tradeBias !== 'touch_only') signal = notouchEval;
    }

    const snapshot = {
      tickIndex: this.tickIndex,
      price: buf.last,
      time: buf.timestamps[buf.timestamps.length - 1],
      symbol: this.symbol,
      features: { velocity, acceleration, volatility, atr: atrVal, rsi: rsiVal, trend, bollinger: boll, delta },
      pattern,
      marketState: stateResult.state,
      stateChanged: stateResult.changed,
      behavior,
      volatilityZone,
      distance: dist,
      score: scoreResult,
      probabilities: probs,
      band,
      validation: { touchEval, notouchEval, rejections },
      signal,
      barrierAbs,
    };

    if (signal) {
      this._handleSignal(signal, snapshot);
    }

    return snapshot;
  }

  async _handleSignal(signal, snapshot) {
    document.dispatchEvent(new CustomEvent('tnt:signal', { detail: snapshot }));
    if (!this.executor) return;

    const marketCtx = {
      symbol: this.symbol,
      barrierOffset: this.barrierOffset,
      duration: this.duration,
      durationUnit: this.durationUnit,
      currency: this.currency,
      currentPrice: snapshot.price,
      touchScore: snapshot.probabilities.touchScore,
      confidence: snapshot.probabilities.confidence,
      marketState: snapshot.marketState,
    };
    const result = await this.executor.tryExecute(signal, marketCtx, this.tickIndex);
    document.dispatchEvent(new CustomEvent('tnt:execution-result', { detail: { ...result, signal, snapshot } }));
  }
}
